  /* ------------------------------------------------------------
     Sound — 《秦岭 · 生生》, a solo upright piano piece written
     for the scroll: 62 bpm, eight bars that flow into themselves,
     and nothing else in the room. Synthesised here so the page
     stays one file and can start the moment it is opened.
  ------------------------------------------------------------ */
  const soundEl = document.getElementById('sound');
  const soundEnEl = document.getElementById('soundEn');
  const sound = { ctx:null, master:null, bus:null, started:false, off:false, nextBar:0, bar:0 };
  const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
  /* partial, amplitude, relative decay — a warm, round upright */
  const PIANO_PARTIALS = [
    [1, 1.00, 1.00], [2, .38, .76], [3, .18, .62], [4, .09, .50],
    [5, .045, .40], [6, .022, .32], [8, .009, .24]
  ];
  const PIANO_BEAT = 60 / 62;
  const PIANO_BAR = PIANO_BEAT * 4;
  const PIANO_CHORDS = [
    [48, 55, 62, 64, 67, 71],   /* Cmaj9   */
    [45, 52, 60, 64, 67, 72],   /* Am9     */
    [41, 48, 57, 60, 64, 67],   /* Fmaj9   */
    [43, 50, 55, 59, 62, 67],   /* G6      */
    [48, 55, 60, 64, 67, 72],   /* C       */
    [45, 52, 57, 60, 64, 69],   /* Am      */
    [50, 57, 60, 62, 65, 69],   /* Dm9     */
    [43, 50, 55, 60, 65, 67]    /* G7sus4  */
  ];
  const PIANO_ARP = [
    [0, 2, 3, 4, 3, 2, 1, 2],
    [0, 3, 2, 4, 3, 5, 4, 2],
    [0, 2, 4, 3, 5, 3, 2, 1]
  ];
  /* beat, midi, beats held, velocity — one plain line, no leaps */
  const PIANO_MEL = [
    [[0, 76, 1.5, .30], [1.5, 79, .5, .26], [2, 76, 1.5, .25]],
    [[0, 74, 1.5, .30], [1.5, 72, .5, .26], [2, 74, 2, .24]],
    [[0, 72, 1.5, .28], [1.5, 74, .5, .24], [2, 76, 2, .26]],
    [[0, 74, 2, .28], [2, 79, 1, .22]],
    [[0, 79, 1.5, .28], [1.5, 81, .5, .24], [2, 79, 1.5, .25]],
    [[0, 76, 1.5, .28], [1.5, 74, .5, .24], [2, 72, 2, .24]],
    [[0, 74, 1.5, .27], [1.5, 72, .5, .23], [2, 69, 2, .24]],
    [[0, 67, 1.5, .26], [1.5, 72, .5, .23], [2, 74, 2, .24]]
  ];

  function buildSound(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    let ctx;
    try{ ctx = new AC(); }catch(err){ return false; }

    const master = ctx.createGain();
    master.gain.value = 0;
    /* no bottom rumble, no brittle top end */
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 55;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7200;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 9; comp.ratio.value = 2;
    comp.attack.value = .03; comp.release.value = .4;
    master.connect(hp); hp.connect(lp); lp.connect(comp); comp.connect(ctx.destination);
    const an = ctx.createAnalyser(); an.fftSize = 2048; comp.connect(an); sound.analyser = an;

    /* a small wooden room: two short damped delays under the dry note */
    const bus = ctx.createGain(); bus.gain.value = 1;
    const d1 = ctx.createDelay(1); d1.delayTime.value = .043;
    const d2 = ctx.createDelay(1); d2.delayTime.value = .061;
    const damp = ctx.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 2000;
    const fb = ctx.createGain(); fb.gain.value = .3;
    const wet = ctx.createGain(); wet.gain.value = .28;
    bus.connect(d1); d1.connect(damp); damp.connect(fb); fb.connect(d1);
    d1.connect(wet); bus.connect(d2); d2.connect(wet);
    wet.connect(master);
    const dry = ctx.createGain(); dry.gain.value = .94;
    bus.connect(dry); dry.connect(master);

    sound.ctx = ctx;
    sound.master = master;
    sound.bus = bus;
    sound.started = true;
    sound.nextBar = ctx.currentTime + .12;
    sound.bar = 0;
    return true;
  }

  function soundLevel(v){
    if(!sound.ctx) return;
    const t = sound.ctx.currentTime;
    sound.master.gain.cancelScheduledValues(t);
    sound.master.gain.setTargetAtTime(v, t, 1.4);
  }

  function startSound(){
    if(!sound.started && !buildSound()) return;
    if(sound.ctx.state === 'suspended'){
      const p = sound.ctx.resume();
      if(p && p.catch) p.catch(() => {});
    }
    soundLevel(sound.off ? 0 : .66);
  }

  function setSoundOff(off){
    sound.off = !!off;
    if(soundEl){
      soundEl.classList.toggle('off', sound.off);
      soundEl.setAttribute('aria-pressed', String(!sound.off));
    }
    if(soundEnEl) soundEnEl.textContent = sound.off ? 'Muted' : 'Sound';
    if(sound.off) soundLevel(0); else startSound();
  }

  /* one piano note: a doubled fundamental, soft partials above it,
     an upright's quiet attack, and a gentle roll-off as it dies away */
  function pianoNote(midi, when, vel, dur, pan){
    const ctx = sound.ctx;
    if(!ctx) return;
    const freq = mtof(midi);
    const t = Math.max(when, ctx.currentTime + .015);
    const out = ctx.createGain();
    out.gain.value = .30 * vel;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    const cut = Math.min(4200, 2000 + 1300 * vel + (midi - 60) * 14);
    lp.frequency.setValueAtTime(cut, t);
    lp.frequency.exponentialRampToValueAtTime(1100 + 500 * vel, t + Math.min(3, dur));
    let tail = lp;
    if(ctx.createStereoPanner){
      const p = ctx.createStereoPanner();
      p.pan.value = pan || 0;
      lp.connect(p); tail = p;
    }
    tail.connect(sound.bus);
    for(const [n, amp, dec] of PIANO_PARTIALS){
      const f = freq * n * Math.sqrt(1 + .00035 * n * n);
      const cents = (n === 1 ? 2.4 : 1.6);
      const g = ctx.createGain();
      g.gain.setValueAtTime(.000001, t);
      g.gain.linearRampToValueAtTime(amp, t + .009);
      g.gain.exponentialRampToValueAtTime(amp * .55, t + .5);
      g.gain.exponentialRampToValueAtTime(.000001, t + dur * dec);
      const sides = n === 1 ? [-1, 1] : [0];
      for(const side of sides){
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.value = f;
        if(side) o.detune.value = side * cents;
        const half = ctx.createGain(); half.gain.value = sides.length > 1 ? .5 : 1;
        o.connect(half); half.connect(g);
        o.start(t); o.stop(t + dur * dec + .06);
      }
      g.connect(out);
    }
    out.connect(lp);
  }

  /* eight bars of broken chords under a plain, unhurried tune */
  function scheduleBar(bar, at){
    const i = bar % PIANO_CHORDS.length;
    const ch = PIANO_CHORDS[i];
    const pat = PIANO_ARP[i % PIANO_ARP.length];
    pianoNote(ch[0], at, .24, PIANO_BAR * 1.25, -.10);
    for(let k = 0; k < 8; k++){
      /* start above the bass so the bar does not thump on its first beat */
      const n = ch[pat[(k + 1) % pat.length]];
      pianoNote(n, at + k * PIANO_BEAT / 2 + (Math.random() - .5) * .01,
                .20 + Math.random() * .06, 2.5 + Math.random() * .9, (n - 60) / 70);
    }
    for(const [beat, n, held, vel] of PIANO_MEL[i]){
      pianoNote(n, at + beat * PIANO_BEAT + (Math.random() - .5) * .008, vel,
                Math.max(2.2, held * PIANO_BEAT * 1.5), .07);
    }
  }

  function soundTick(){
    const ctx = sound.ctx;
    if(!ctx) return;
    const t = ctx.currentTime;
    if(!sound.off && ctx.state === 'running'){
      if(sound.nextBar < t) sound.nextBar = t + .12;
      while(sound.nextBar < t + 1.5){
        scheduleBar(sound.bar++, sound.nextBar);
        sound.nextBar += PIANO_BAR;
      }
    }
  }
  setInterval(soundTick, 240);

  if(soundEl) soundEl.addEventListener('click', () => setSoundOff(!sound.off));

  /* the piece is meant to begin the moment the page is opened; where the
     browser still demands a first gesture, the first touch starts it */
  const WAKE_EVENTS = ['pointerdown','pointerup','keydown','keyup','touchstart','touchend','click','pointermove','wheel'];
  let wakeTry = 0;
  function unwake(){
    WAKE_EVENTS.forEach(t => window.removeEventListener(t, wakeSound, true));
  }
  function wakeSound(e){
    if(!sound.ctx) return;
    if(sound.ctx.state === 'running'){ unwake(); return; }
    const kind = e && e.type;
    /* a pointer merely passing over the paper cannot unlock sound; keep
       those attempts rare so the click that follows is not crowded out */
    if(kind === 'pointermove' || kind === 'wheel'){
      const now = performance.now();
      if(now - wakeTry < 600) return;
      wakeTry = now;
    }
    try{
      const p = sound.ctx.resume();
      if(p && p.then) p.then(() => {
        if(sound.ctx && sound.ctx.state === 'running') unwake();
      }, () => {});
    }catch(err){}
  }
  WAKE_EVENTS.forEach(t => window.addEventListener(t, wakeSound, true));

  /* ask for sound now; if the browser says not yet, the first touch will */
  startSound();

  document.addEventListener('visibilitychange', () => {
    if(!sound.ctx) return;
    if(document.hidden) sound.ctx.suspend();
    else if(!sound.off) sound.ctx.resume().catch(() => {});
  });

  /* leaving the page takes the music with it */
  window.addEventListener('pagehide', () => { if(sound.ctx) sound.ctx.suspend(); });
  window.addEventListener('pageshow', () => { if(sound.ctx && !sound.off) sound.ctx.resume().catch(() => {}); });

  }

  function screenToWorld(cx, cy){
    return { x: (cx + camX - ox) / scale, y: (cy - oy) / scale };
  }
  function isValidGround(x, y){
    return x >= 0 && x <= SCROLL_W && y >= ridgeY(x) + 1 && y <= H;
  }

  function plantSizeFor(type, x, y, alt){
    const depth = clamp((y - ridgeY(x)) / (H - ridgeY(x)), 0, 1);
    const persp = .46 + depth * 1.30;
    const altScale = alt > 3300 ? .60 : (alt > 3000 ? .78 : 1);
    const base = TYPE_INFO[type] ? TYPE_INFO[type].base : 28;
    return Math.max(9, base * persp * altScale * (.82 + Math.random()*.40));
  }

  function chooseType(alt){
    const t = chooseTypeRaw(alt);
    if(SEASON === 3 && t === 'flower') return alt > 3000 ? 'cushion' : 'grass';
    if(SEASON === 0 && t === 'grass' && Math.random() < .32) return 'flower';
    return t;
  }
  function chooseTypeRaw(alt){
    const r = Math.random();
    if(alt >= 3350){
      if(r < .40) return 'cushion';
      if(r < .66) return 'grass';
      if(r < .84) return 'flower';
      if(r < .94) return 'lichen';
      return 'twisted';
    }
    if(alt >= 3000){
      if(r < .28) return 'rhodo';
      if(r < .44) return 'willow';
      if(r < .58) return 'dwarfBamboo';
      if(r < .72) return 'twisted';
      if(r < .90) return 'grass';
      return 'flower';
    }
    if(alt >= 2200){
      if(r < .30) return 'pine';
      if(r < .58) return 'fir';
      if(r < .70) return 'birch';
      if(r < .86) return 'grass';
      return 'flower';
    }
    if(alt >= 1700){
      if(r < .24) return 'oak';
      if(r < .40) return 'birch';
      if(r < .56) return 'pine';
      if(r < .66) return 'fir';
      if(r < .82) return 'grass';
      return 'flower';
    }
    if(r < .18) return 'oak';
    if(r < .28) return 'maple';
    if(r < .36) return 'bamboo';
    if(r < .46) return 'fern';
    if(r < .78) return 'grass';
    return 'flower';
  }

  const DURATIONS = {
    oak:2600, maple:2500, birch:2400, pine:2800, fir:2850, bamboo:2200,
    dwarfBamboo:2000, rhodo:2350, willow:2200, twisted:2450, fern:1700,
    grass:1300, flower:2050, cushion:1450, lichen:1050
  };

  function spawnPlant(x, y, opts){
    opts = opts || {};
    if(plants.length >= 320 && !opts.force) return null;
    const alt = altitudeAt(x, y);
    const type = opts.type || chooseType(alt);
    const size = opts.size || plantSizeFor(type, x, y, alt);
    const depth = clamp((y - ridgeY(x)) / (H - ridgeY(x)), 0, 1);
    const fog = opts.fog !== undefined ? opts.fog : clamp(.04 + (1-depth)*.34, 0, .46);
    const info = TYPE_INFO[type] || TYPE_INFO.grass;
    const start = opts.start !== undefined ? opts.start : nowMs;
    const baseDur = DURATIONS[type] || 1800;
    const duration = opts.duration || baseDur * (.85 + Math.random()*.35);
    const seed = opts.seed !== undefined ? opts.seed : ((Math.random()*2147483647)|0);

    const pl = {
      x, y, alt, type, size, seed, fog,
      detail: opts.detail !== undefined ? opts.detail : 1.0,
      start, duration,
      mature: false,
      dying: 0,
      beeChecked: false
    };
    plants.push(pl);
    if(info.cat === 'herb') counts.herb++;
    else if(info.cat === 'flower') counts.flower++;
    else if(info.cat === 'wood') counts.wood++;
    setCounts();

    if(!opts.silent){
      ripples.push({
        x, y, start: opts.start !== undefined ? opts.start : nowMs,
        dur: 1050,
        size: 17 + Math.random()*12,
        seed: (Math.random()*99999)|0
      });
      hintEl.classList.add('hide');
    }
    plantLayerDirty = true;
    return pl;
  }

  function plantProgress(pl, now){
    return clamp((now - pl.start) / pl.duration, 0, 1);
  }

  function drawPlant(g, pl, now){
    let alpha = 1;
    if(pl.dying){
      alpha = 1 - clamp((now - pl.dying)/720, 0, 1);
      if(alpha <= 0) return;
    }
    const p = plantProgress(pl, now);
    g.save();
    g.globalAlpha = alpha;
    if(p < .10) drawSeedling(g, pl.x, pl.y, pl.size, pl.seed, p);
    else drawPlantByType(g, pl.type, pl.x, pl.y, pl.size, pl.seed, pl.fog, pl.detail, p, pl.alt);
    g.restore();
  }

  function redrawPlantLayer(now){
    plantLayerDirty = false;
    if(plantCanvas.width !== plateW || plantCanvas.height !== plateH){
      plantCanvas.width = Math.max(1, plateW);
      plantCanvas.height = Math.max(1, plateH);
    }
    pctx.setTransform(1,0,0,1,0,0);
    pctx.clearRect(0,0,plantCanvas.width,plantCanvas.height);
    /* the plant layer follows the unrolled stretch, and only what is in
       the frame is drawn */
    pctx.setTransform(plateScale, 0, 0, plateScale, plateScale*(ox - camX), plateScale*oy);
    pctx.scale(scale, scale);
    const xlo = (camX - ox) / scale - 140;
    const xhi = (camX - ox + cssW) / scale + 140;
    const sorted = plants.filter(p => p.x > xlo && p.x < xhi).sort((a,b) => a.y - b.y);
    for(const pl of sorted) drawPlant(pctx, pl, now);
  }

  function updatePlants(now){
    let animating = false;
    for(let i=plants.length-1;i>=0;i--){
      const pl = plants[i];
      if(pl.dying){
        if(now - pl.dying >= 720){
          plants.splice(i,1);
          animating = true;
        } else {
          animating = true;
        }
        continue;
      }
      const p = plantProgress(pl, now);
      if(p < 1){
        animating = true;
      } else if(!pl.mature){
        pl.mature = true;
        animating = true;
        if(pl.type === 'flower') maybeSpawnBees(pl, now);
      }
    }
    if(animating) plantLayerDirty = true;
  }

  /* ------------------------------------------------------------
     Bees
  ------------------------------------------------------------ */
  function maybeSpawnBees(flower, now){
    if(SEASON === 3) return;
    if(now < beeCooldown) return;
    if(swarms.length > 0) return;
    const swarmChance = SEASON === 0 ? .74 : (SEASON === 2 ? .32 : .52);
    if(Math.random() > swarmChance) return;
    const near = [flower];
    for(const p of plants){
      if(p === flower || !p.mature || p.type !== 'flower') continue;
      const dx = p.x - flower.x, dy = p.y - flower.y;
      if(dx*dx + dy*dy < 145*145) near.push(p);
      if(near.length >= 3) break;
    }
    const cx = near.reduce((a,p)=>a+p.x,0)/near.length;
    const cy = near.reduce((a,p)=>a+p.y-p.size*.55,0)/near.length;

    const n = (SEASON === 0 ? 7 : (SEASON === 2 ? 4 : 5)) + Math.floor(Math.random()*3);
    const bees = [];
    for(let i=0;i<n;i++){
      bees.push({
        phase: Math.random()*TAU,
        rx: 16 + Math.random()*42,
        ry: 7 + Math.random()*17,
        speed: .34 + Math.random()*.34,
        wob: 1.4 + Math.random()*2.6,
        size: 3.4 + Math.random()*1.6,
        wing: Math.random()*10
      });
    }
    swarms.push({
      cx, cy, start: now,
      dur: 5200 + Math.random()*1800,
      bees
    });
    beeCooldown = now + 24000 + Math.random()*16000;
  }

  function drawBee(g, bx, by, bee, now, alpha, plain){
    const t = (now - bee.wing) * .024;
    const flap = Math.abs(Math.sin(t));
    g.save();
    g.translate(bx, by);
    g.globalAlpha *= alpha;

    // wings
    g.fillStyle = plain ? 'rgba(226,230,225,.30)' : 'rgba(247,245,231,.44)';
    g.beginPath();
    g.ellipse(-1.7, -1.9, 2.6, 1.05 + flap*.55, -.55, 0, TAU);
    g.fill();
    g.beginPath();
    g.ellipse(1.8, -2.0, 2.5, 1.0 + flap*.5, .55, 0, TAU);
    g.fill();

    // body
    g.fillStyle = plain ? 'rgba(128,133,126,.92)' : 'rgba(206,168,94,.95)';
    g.beginPath();
    g.ellipse(0, 0, 3.0, 1.6, .12, 0, TAU);
    g.fill();

    // stripes
    g.strokeStyle = plain ? 'rgba(82,88,82,.72)' : 'rgba(61,52,38,.78)';
    g.lineWidth = .85;
    g.beginPath();
    g.moveTo(-.55, -1.45);
    g.lineTo(-.55, 1.45);
    g.moveTo(1.15, -1.18);
    g.lineTo(1.15, 1.18);
    g.stroke();

    // head
    g.fillStyle = plain ? 'rgba(78,84,78,.9)' : 'rgba(54,48,37,.9)';
    g.beginPath();
    g.arc(-2.65, 0, .95, 0, TAU);
    g.fill();

    g.restore();
  }

  /* ------------------------------------------------------------
     A resident bee colony that follows the cursor, plus the
     weather of each season (petals, leaves, snow, pollen).
  ------------------------------------------------------------ */
  const colony = [];
  const BEE_COUNT = [12, 9, 5, 2];
  const BEE_TEMPO = [
    { wander: .20, orbit: .94, cruise: 27, pursue: 62, reach: 430 },
    { wander: .20, orbit: .84, cruise: 23, pursue: 54, reach: 390 },
    { wander: .13, orbit: .58, cruise: 16, pursue: 38, reach: 330 },
    { wander: .08, orbit: .30, cruise: 9, pursue: 22, reach: 270 }
  ];
  function seedColony(){
    colony.length = 0;
    for(let i=0;i<BEE_COUNT[0];i++){
      const x = 160 + Math.random()*(W - 320);
      const y = Math.max(meadowTopY(x) + 36, 560) + Math.random()*220;
      colony.push({
        x, y, vx: 0, vy: 0,
        phase: Math.random()*TAU,
        seed: Math.random()*900,
        wing: Math.random()*10,
        scatterT: 0,
        size: .62 + Math.random()*.28
      });
    }
  }

  function updateColony(now, dt){
    const active = BEE_COUNT[SEASON];
    const tempo = BEE_TEMPO[SEASON];
    const t = ambientMs * .001;
    const adt = dt * PACE;
    for(let i=0;i<active;i++){
      const bee = colony[i];
      if(!bee) continue;
      const wa = noise1(bee.seed + t*tempo.wander) * TAU;
      let tx = bee.x + Math.cos(wa)*140;
      let ty = bee.y + Math.sin(wa)*72;
      let spd = tempo.cruise;

      if(now > bee.scatterT && hoverValid){
        const dx = pointer.wx - bee.x, dy = pointer.wy - bee.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if(d < tempo.reach){
          const orbit = bee.phase + t*tempo.orbit;
          tx = pointer.wx + Math.cos(orbit)*40;
          ty = pointer.wy + Math.sin(orbit)*23 - 5;
          spd = tempo.pursue;
        }
      }

      const dx = tx - bee.x, dy = ty - bee.y;
      const dd = Math.sqrt(dx*dx + dy*dy) || 1;
      const k = Math.min(1, adt*2.2);
      bee.vx += (dx/dd*spd - bee.vx)*k;
      bee.vy += (dy/dd*spd - bee.vy)*k;
      if(now < bee.scatterT){ bee.vx *= .93; bee.vy *= .93; }
      bee.x += bee.vx*adt;
      bee.y += bee.vy*adt + Math.sin(t*8 + bee.phase)*7*adt;
      bee.x = clamp(bee.x, 18, SCROLL_W - 18);
      bee.y = clamp(bee.y, Math.max(ridgeY(bee.x) + 6, 90), H - 14);
    }
  }

  function drawColony(g, now){
    const active = BEE_COUNT[SEASON];
    for(let i=0;i<active;i++){
      const bee = colony[i];
      if(!bee) continue;
      const plain = maskAlphaAt(bee.x, bee.y) < .38;
      g.save();
      g.translate(bee.x, bee.y);
      g.scale(bee.size, bee.size);
      g.translate(-bee.x, -bee.y);
      drawBee(g, bee.x, bee.y + Math.sin(ambientMs*.0045 + bee.phase)*.8,
        bee, now, 1, plain);
      g.restore();
    }
  }

  const seasonFX = [];
  let fxLast = 0;

  /* the window of world the frame is showing, used to keep weather local */
  function viewWX0(){ return (camX - ox) / scale; }

  function reseedSeasonFX(){
    seasonFX.length = 0;
    const n = SEASON === 3 ? 150 : (SEASON === 2 ? 46 : (SEASON === 0 ? 42 : 18));
    const vx = viewWX0();
    for(let i=0;i<n;i++){
      seasonFX.push({
        x: vx + Math.random()*W,
        y: Math.random()*H,
        vy: SEASON === 3 ? 26 + Math.random()*34 : 9 + Math.random()*20,
        vx: -8 + Math.random()*16,
        sway: 8 + Math.random()*22,
        phase: Math.random()*TAU,
        rot: Math.random()*TAU,
        vr: -.9 + Math.random()*1.8,
        size: SEASON === 3 ? 1.3 + Math.random()*2.3
            : SEASON === 2 ? 2.2 + Math.random()*2.6
            : 1.8 + Math.random()*2.2,
        tone: Math.random()
      });
    }
  }

  function updateSeasonFX(now, dt){
    const vx = viewWX0();
    for(const p of seasonFX){
      p.y += p.vy*dt*PACE;
      p.x += (p.vx + Math.sin(ambientMs*.0011 + p.phase)*p.sway)*dt*PACE;
      p.rot += p.vr*dt*PACE;
      if(p.y > H + 8){ p.y = -10; p.x = vx + Math.random()*W; }
      if(p.y < -12) p.y = H + 6;
      if(p.x < vx - 10) p.x = vx + W + 8;
      if(p.x > vx + W + 10) p.x = vx - 8;
    }
  }

  function drawSeasonFX(g, now){
    if(!seasonFX.length) return;
    g.save();
    for(const p of seasonFX){
      if(SEASON === 3){
        g.globalAlpha = .42 + .34*Math.abs(Math.sin(now*.00082 + p.phase));
        g.fillStyle = '#f3f8fc';
        g.beginPath();
        g.arc(p.x, p.y, p.size*.78, 0, TAU);
        g.fill();
        continue;
      }
      const revealed = maskAlphaAt(p.x, p.y) > .35;
      let col;
      if(SEASON === 2) col = revealed ? (p.tone < .5 ? [177,96,44] : [201,143,56]) : [149,150,142];
      else if(SEASON === 0) col = revealed ? [244,203,210] : [157,159,153];
      else col = revealed ? [226,212,157] : [158,160,154];
      g.save();
      g.translate(p.x, p.y);
      g.rotate(p.rot);
      g.globalAlpha = SEASON === 1 ? .46 : .72;
      g.fillStyle = rgba(col, .9);
      if(SEASON === 1){
        g.beginPath(); g.arc(0, 0, p.size*.48, 0, TAU); g.fill();
      } else {
        g.beginPath(); g.ellipse(0, 0, p.size, p.size*.42, 0, 0, TAU); g.fill();
      }
      g.restore();
    }
    g.restore();
  }

  function drawSwarms(g, now){
    for(let i=swarms.length-1;i>=0;i--){
      const sw = swarms[i];
      const age = (now - sw.start) / sw.dur;
      if(age >= 1){ swarms.splice(i,1); continue; }
      const alpha = smoothstep(0, .12, age) * (1 - smoothstep(.78, 1, age));
      if(alpha <= 0) continue;
      const time = (now - sw.start) / 1000 * .62;

      for(const bee of sw.bees){
        const ang = bee.phase + time * bee.speed;
        const bx = sw.cx + Math.cos(ang) * bee.rx;
        const by = sw.cy + Math.sin(ang) * bee.ry + Math.sin(time*2.1 + bee.phase) * bee.wob;

        // faint flight trail
        g.save();
        g.globalAlpha *= alpha * .10;
        g.strokeStyle = 'rgba(230,218,180,.8)';
        g.lineWidth = .7;
        g.beginPath();
        g.moveTo(bx, by);
        for(let k=1;k<=3;k++){
          const aa = ang - k*.10;
          const tx = sw.cx + Math.cos(aa) * bee.rx;
          const ty = sw.cy + Math.sin(aa) * bee.ry + Math.sin((time - k*.1)*2.1 + bee.phase) * bee.wob;
          g.lineTo(tx, ty);
        }
        g.stroke();
        g.restore();

        drawBee(g, bx, by, bee, now, alpha);
      }
    }
  }

  /* ------------------------------------------------------------
     Ripples & cursor
  ------------------------------------------------------------ */
  function drawRipples(g, now){
    for(let i=ripples.length-1;i>=0;i--){
      const r = ripples[i];
      const t = (now - r.start) / r.dur;
      if(t >= 1){ ripples.splice(i,1); continue; }
      const a = 1 - t;
      g.save();
      for(let k=0;k<3;k++){
        const tt = clamp(t - k*.11, 0, 1);
        if(tt <= 0) continue;
        const rad = r.size * (.18 + tt*1.05);
        g.strokeStyle = rgba([124,111,81], a*.34*(1-k*.22));
        g.lineWidth = 1.05;
        g.beginPath();
        g.ellipse(r.x, r.y, rad, rad*.25, 0, 0, TAU);
        g.stroke();
      }
      softEllipse(g, r.x, r.y, r.size*.78*a + 2, r.size*.18*a + 1, [78,70,49], .18*a);
      g.restore();
    }
  }

  function drawCursor(g){
    if(shimHot >= 0) return;
    if(cursorAlpha <= .015) return;
    const x = pointer.wx, y = pointer.wy;
    if(!isValidGround(x, y)) return;
    g.save();
    g.globalAlpha = cursorAlpha;
    const gr = g.createRadialGradient(x, y, 0, x, y, 24);
    gr.addColorStop(0, 'rgba(247,237,209,.22)');
    gr.addColorStop(.55, 'rgba(247,237,209,.08)');
    gr.addColorStop(1, 'rgba(247,237,209,0)');
    g.fillStyle = gr;
    g.beginPath();
    g.arc(x, y, 24, 0, TAU);
    g.fill();
    g.restore();
  }

  /* ------------------------------------------------------------
     The pointer is itself a bee; a small swarm of companions keeps
     close about it, each drifting on its own slow orbit.
  ------------------------------------------------------------ */
  const ptrBee = { x:0, y:0, vx:0, vy:0, ang:0, a:0, wing:0, init:false };

  /* one even pace for the leading bee: a slow steady cruise, and any
     change of speed is spread over several frames, so it never bolts */
  const PTR_CRUISE = 158;   /* px per second */
  const PTR_ACCEL  = 210;   /* px per second, per second */

  /* the leader flies at the pointer; the others mill around it, each on
     its own slow orbit, so the group reads as a swarm and never a row */
  const PTR_TRAIN_N = 7;
  const PTR_SLOTS = [
    { back: 26, side: -18, sz: .97, sp: 1.02, ph: .40 },
    { back: 22, side:  19, sz: 1.00, sp: 1.31, ph: 2.20 },
    { back: 42, side:   6, sz: .90, sp: .87, ph: 3.50 },
    { back: 34, side: -30, sz: .94, sp: 1.17, ph: 5.10 },
    { back: 52, side:  26, sz: .84, sp: .78, ph: 1.30 },
    { back: -10, side: 24, sz: .88, sp: 1.40, ph: 4.40 },
    { back: -18, side: -14, sz: .91, sp: .95, ph: 6.00 }
  ];
  const ptrBees = PTR_SLOTS.map(() => ({
    x:0, y:0, ang:0, a:0, wing:Math.random()*6, init:false
  }));

  function updatePointerBees(now, dt){
    const show = pointer.inCanvas && !pointerTouch && shimHot < 0 && pointer.x > -1;
    const tx = pointer.x, ty = pointer.y;

    if(show && !ptrBee.init){ ptrBee.init = true; ptrBee.x = tx; ptrBee.y = ty; }
    if(ptrBee.init){
      const dx = tx - ptrBee.x, dy = ty - ptrBee.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < 1.6){
        ptrBee.x = tx; ptrBee.y = ty;
        ptrBee.vx *= .4; ptrBee.vy *= .4;
      } else {
        const ux = dx / dist, uy = dy / dist;
        /* the cruise stays the same however far the hand has gone; only
           the final few pixels ease off, so it drifts in and settles */
        const cruise = Math.min(PTR_CRUISE, PTR_CRUISE * dist / 16);
        let ax = ux * cruise - ptrBee.vx;
        let ay = uy * cruise - ptrBee.vy;
        const al = Math.sqrt(ax*ax + ay*ay);
        const cap = PTR_ACCEL * dt;
        if(al > cap){ ax *= cap / al; ay *= cap / al; }
        ptrBee.vx += ax; ptrBee.vy += ay;
        ptrBee.x += ptrBee.vx * dt;
        ptrBee.y += ptrBee.vy * dt;
      }
      if(dist > 1.4){
        const want = Math.atan2(dy, dx);
        let diff = want - ptrBee.ang;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        ptrBee.ang += diff * Math.min(1, dt * 1.9);
      }
    }
    ptrBee.a += ((show ? 1 : 0) - ptrBee.a) * Math.min(1, dt * 6);
    ptrBee.wing += dt * 24;

    const dirX = Math.cos(ptrBee.ang), dirY = Math.sin(ptrBee.ang);
    const perpX = -dirY, perpY = dirX;
    const t = ambientMs * .001;

    /* two hands close together pull the companions in; two hands apart
       send them ranging wider.  one hand (or the mouse) keeps them as is */
    gesture.spread += (gesture.spreadTarget - gesture.spread) * Math.min(1, dt * 2.0);
    const spread = gesture.spread;

    for(let i=0;i<PTR_TRAIN_N;i++){
      const f = ptrBees[i];
      const s = PTR_SLOTS[i];
      f.a += ((show ? 1 : 0) - f.a) * Math.min(1, dt * 5.2);
      f.wing += dt * (21 + i * 1.6);
      if(!show && f.a < .06){ f.init = false; continue; }
      if(!show && !f.init) continue;

      const swing = Math.sin(t * s.sp + s.ph);
      const drift = Math.cos(t * s.sp * .77 + s.ph * 1.6);
      const arc = t * s.sp * .52 + s.ph * 2.1;
      const back = (s.back + drift * 6.5) * spread;
      const side = (s.side + swing * 8.5) * spread;
      const gx = ptrBee.x - dirX * back + perpX * side + Math.cos(arc) * 3.2 * spread;
      const gy = ptrBee.y - dirY * back + perpY * side + Math.sin(arc) * 3.2 * spread;
      if(!f.init){ f.init = true; f.x = gx; f.y = gy; f.ang = ptrBee.ang; }
      const k = Math.min(1, dt * (1.35 + i * .14));
      const ox = f.x, oy = f.y;
      f.x += (gx - f.x) * k;
      f.y += (gy - f.y) * k;
      const vx = f.x - ox, vy = f.y - oy;
      if(vx*vx + vy*vy > .05){
        const want = Math.atan2(vy, vx);
        let diff = want - f.ang;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        f.ang += diff * Math.min(1, dt * 2.8);
      }
    }
    if(!show && ptrBee.a < .05) ptrBee.init = false;
  }

  function drawBeeMark(g, x, y, s, ang, flap, alpha){
    if(alpha <= .02) return;
    g.save();
    g.translate(x, y);
    g.rotate(ang);
    g.scale(s, s);
    g.globalAlpha *= alpha;

    /* abdomen */
    const bg = g.createLinearGradient(-4.6, -1.5, 1.2, 1.5);
    bg.addColorStop(0, 'rgba(146,102,44,.99)');
    bg.addColorStop(.50, 'rgba(210,168,90,.99)');
    bg.addColorStop(1, 'rgba(176,130,62,.99)');
    g.fillStyle = bg;
    g.beginPath();
    g.ellipse(-1.0, 0, 3.7, 1.9, 0, 0, TAU);
    g.fill();

    /* dark bands */
    g.strokeStyle = 'rgba(46,34,20,.84)';
    g.lineWidth = .9;
    for(const bx of [-2.6, -.9]){
      g.beginPath();
      g.moveTo(bx, -1.5);
      g.quadraticCurveTo(bx + .45, 0, bx, 1.5);
      g.stroke();
    }

    /* wings, laid back over the abdomen */
    const wf = .45 + flap * .55;
    g.fillStyle = 'rgba(250,248,238,' + (.19 + flap * .09).toFixed(3) + ')';
    g.strokeStyle = 'rgba(146,136,112,.22)';
    g.lineWidth = .40;
    for(const sgn of [-1, 1]){
      g.save();
      g.translate(2.2, sgn * 1.15);
      g.rotate(sgn * (.16 + flap * .10));
      g.beginPath();
      g.ellipse(-3.2, sgn * .35, 3.2, .80 + wf * .30, sgn * -.18, 0, TAU);
      g.fill();
      g.stroke();
      g.restore();
    }

    /* thorax */
    const th = g.createRadialGradient(2.0, -1.0, .4, 2.6, 0, 2.5);
    th.addColorStop(0, 'rgba(214,178,116,.99)');
    th.addColorStop(.55, 'rgba(146,104,54,.99)');
    th.addColorStop(1, 'rgba(96,68,36,.99)');
    g.fillStyle = th;
    g.beginPath();
    g.ellipse(2.5, 0, 1.9, 1.7, 0, 0, TAU);
    g.fill();

    /* a little fuzz on the shoulders */
    g.strokeStyle = 'rgba(232,204,154,.30)';
    g.lineWidth = .35;
    for(let k = 0; k < 8; k++){
      const a2 = k / 8 * TAU;
      g.beginPath();
      g.moveTo(2.5 + Math.cos(a2) * 1.5, Math.sin(a2) * 1.35);
      g.lineTo(2.5 + Math.cos(a2) * 2.25, Math.sin(a2) * 2.05);
      g.stroke();
    }

    /* head */
    g.fillStyle = 'rgba(42,34,24,.97)';
    g.beginPath();
    g.ellipse(4.4, 0, 1.35, 1.2, 0, 0, TAU);
    g.fill();
    g.fillStyle = 'rgba(255,246,224,.28)';
    g.beginPath();
    g.ellipse(4.05, -.55, .40, .32, .3, 0, TAU);
    g.fill();

    /* antennae */
    g.strokeStyle = 'rgba(42,34,24,.66)';
    g.lineWidth = .42;
    g.beginPath();
    g.moveTo(5.3, -.45); g.quadraticCurveTo(6.2, -1.4, 6.7, -2.0);
    g.moveTo(5.3, .45);  g.quadraticCurveTo(6.2, 1.4, 6.7, 2.0);
    g.stroke();

    /* a soft rim, so it reads against pale sky */
    g.strokeStyle = 'rgba(255,250,236,.20)';
    g.lineWidth = .5;
    g.beginPath();
    g.ellipse(-1.0, 0, 3.7, 1.9, 0, -2.45, -.75);
    g.stroke();

    g.restore();
  }

  function drawPointerBees(g, now){
    if(ptrBee.a <= .02) return;
    for(let i = PTR_TRAIN_N - 1; i >= 0; i--){
      const f = ptrBees[i], s = PTR_SLOTS[i];
      drawBeeMark(g, f.x, f.y, 1.64 * s.sz, f.ang,
        Math.abs(Math.sin(f.wing)), f.a * (.86 + (i % 3) * .04));
    }
    drawBeeMark(g, ptrBee.x, ptrBee.y, 2.05, ptrBee.ang,
      Math.abs(Math.sin(ptrBee.wing)), ptrBee.a);
  }

  /* ------------------------------------------------------------
     Atmosphere
  ------------------------------------------------------------ */
  function drawAnimatedMist(g, now){
    const t = now * .000030;
    const vx = viewWX0();
    g.save();
    g.beginPath();
    g.rect(vx, 0, W, 790);
    g.clip();
    softEllipse(g, vx + 300 + Math.sin(t)*55, 520, 520, 74, [240,242,234], .085);
    softEllipse(g, vx + 1120 + Math.cos(t*1.3)*44, 470, 600, 88, [240,242,234], .075);
    softEllipse(g, vx + 760 + Math.sin(t*.8+2)*70, 640, 720, 62, [239,241,232], .055);
    softEllipse(g, vx + 1480 + Math.sin(t*1.1+1)*30, 560, 420, 58, [240,242,234], .06);
    g.restore();
  }

  /* ------------------------------------------------------------
     Pointer & UI events
  ------------------------------------------------------------ */
  const pointer = { x:-1, y:-1, wx:-1, wy:-1, down:false, inCanvas:false };
  let pointerTouch = false;

  function onPointerMove(e){
    pointerTouch = e.pointerType === 'touch';
    gesture.mouseAt = performance.now();
    if(gesture.on && gesture.has) return;
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.inCanvas = true;
    const w = screenToWorld(e.clientX, e.clientY);
    pointer.wx = w.x;
    pointer.wy = w.y;
    const valid = isValidGround(w.x, w.y);
    hoverValid = valid;

    if(valid){
      const alt = altitudeAt(w.x, w.y);
      targetAlt = alt;
      if(displayAlt === null){ displayAlt = alt; updateAltText(); }
      updateZone(alt);
      readoutEl.classList.remove('idle');
      addBloom(w.x, w.y, performance.now());
    } else {
      if(!readoutEl.classList.contains('idle')) setIdleReadout();
      readoutEl.classList.add('idle');
    }

    if(pointer.down && valid){
      const now = performance.now();
      const dx = w.x - lastPaintX, dy = w.y - lastPaintY;
      if(now - lastPaint > 90 && dx*dx + dy*dy > 420){
        lastPaint = now;
        lastPaintX = w.x;
        lastPaintY = w.y;
        spawnPlant(w.x, w.y);
      }
    }
  }

  function onPointerDown(e){
    if(e.button !== undefined && e.button !== 0) return;
    pointerTouch = e.pointerType === 'touch';
    pointer.inCanvas = true;
    /* a story light takes the click instead of planting */
    const storyHit = shimmerHit(e.clientX, e.clientY);
    if(storyHit >= 0){
      e.preventDefault();
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      toggleNote(storyHit);
      return;
    }
    if(lensT > .12 && lensIdx >= 0){
      const lp = shimmerAt(lensIdx);
      if(Math.hypot(e.clientX - lp.x, e.clientY - lp.y) < lensRadius() * 1.26){
        e.preventDefault();
        if(noteOpen >= 0) closeNote();
        return;
      }
    }
    if(noteOpen >= 0){
      closeNote();
      e.preventDefault();
      return;
    }
    const w = screenToWorld(e.clientX, e.clientY);
    if(!isValidGround(w.x, w.y)) return;
    e.preventDefault();
    painting = true;
    pointer.down = true;
    lastPaint = performance.now();
    lastPaintX = w.x;
    lastPaintY = w.y;
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    // a click startles the bees that are nearby
    const now = performance.now();
    for(const b of colony){
      const dx = b.x - w.x, dy = b.y - w.y;
      const d2 = dx*dx + dy*dy;
      if(d2 < 420*420){
        const d = Math.sqrt(d2) || 1;
        b.vx += dx/d*(230 + Math.random()*90);
        b.vy += dy/d*(190 + Math.random()*70) - 40;
        b.scatterT = now + 950;
      }
    }
    onPointerMove(e);
    spawnPlant(w.x, w.y);
  }

  function onPointerUp(e){
    painting = false;
    pointer.down = false;
    try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
  }

  function onPointerLeave(){
    hoverValid = false;
    pointer.down = false;
    pointer.inCanvas = false;
    painting = false;
    setIdleReadout();
    readoutEl.classList.add('idle');
  }

  canvas.addEventListener('pointermove', onPointerMove, { passive: true });
  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  window.addEventListener('pointerup', onPointerUp, { passive: true });
  window.addEventListener('pointercancel', onPointerUp, { passive: true });
  canvas.addEventListener('pointerleave', onPointerLeave, { passive: true });
  window.addEventListener('keydown', e => {
    if(e.key === 'Escape' || e.key === 'Esc'){ closeNote(); }
  });

  /* ------------------------------------------------------------
     Hand-gesture control. The webcam is read by MediaPipe's hand
     landmarker; the palm centre steers the bee, a thumb-and-index
     pinch takes the place of a click. Everything here is optional:
     if the camera or the model is missing, the mouse works as before.
  ------------------------------------------------------------ */
  const gvidEl = document.getElementById('gvid');
  const gestureEl = document.getElementById('gesture');
  const gestureCnEl = gestureEl.querySelector('.cn');
  const gestureEnEl = gestureEl.querySelector('.en');
  const gesture = {
    on:false, busy:false, has:false, seen:false,
    tx:-1, ty:-1, pose:'none', hist:[], poseAt:0,
    lastFlap:0, lastPlant:0, aimLight:-1, aimDone:-1, aimSince:0,
    lastClick:0, lastSeen:0, mouseAt:0,
    spread:1, spreadTarget:1, ratio:2.2, twoAt:0,
    bothFistAt:0, bothFistFired:false, lastReset:0, noPlant:0,
    lastVideoTime:-1, lastDetect:0,
    landmarker:null, stream:null, video:null
  };

  function setGestureLabel(cn, en){
    gestureCnEl.textContent = cn;
    if(en) gestureEnEl.textContent = en;
    gestureEl.classList.toggle('live', gesture.on);
  }

  async function loadHandModel(){
    const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const mod = await import(V + '/vision_bundle.mjs');
    const fileset = await mod.FilesetResolver.forVisionTasks(V + '/wasm');
    const base = {
      modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
    };
    const opt = {
      runningMode:'VIDEO',
      numHands:2,
      minHandDetectionConfidence:.55,
      minHandPresenceConfidence:.55,
      minTrackingConfidence:.55
    };
    try{
      return await mod.HandLandmarker.createFromOptions(fileset,
        Object.assign({}, opt, { baseOptions: Object.assign({}, base, { delegate:'GPU' }) }));
    }catch(err){
      return await mod.HandLandmarker.createFromOptions(fileset,
        Object.assign({}, opt, { baseOptions: Object.assign({}, base, { delegate:'CPU' }) }));
    }
  }

  function releaseStream(){
    if(gesture.stream){
      for(const track of gesture.stream.getTracks()){ try{ track.stop(); }catch(e){} }
    }
    gesture.stream = null;
    gesture.video = null;
    gvidEl.srcObject = null;
    gvidEl.classList.remove('on');
    if(gesture.landmarker){ try{ gesture.landmarker.close(); }catch(e){} }
    gesture.landmarker = null;
    gesture.on = false;
    gesture.has = false;
    gesture.seen = false;
    gesture.pose = 'none';
    gesture.hist.length = 0;
    gesture.aimLight = -1;
    gesture.aimDone = -1;
    gesture.tx = -1;
    gesture.ty = -1;
    gesture.spread = 1;
    gesture.spreadTarget = 1;
    gesture.ratio = 2.2;
    gesture.twoAt = 0;
  }

  async function startGesture(){
    if(gesture.busy || gesture.on) return;
    gesture.busy = true;
    gestureEl.classList.add('busy');
    setGestureLabel('手势 · 唤起中');
    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{ facingMode:'user', width:{ ideal:640 }, height:{ ideal:480 } }
      });
      gesture.stream = stream;
      gvidEl.srcObject = stream;
      await gvidEl.play();
      gesture.video = gvidEl;
      setGestureLabel('手势 · 载入模型');
      gesture.landmarker = await loadHandModel();
      gesture.on = true;
      gesture.lastVideoTime = -1;
      gesture.lastDetect = 0;
      gesture.mouseAt = performance.now();
      gvidEl.classList.add('on');
      setGestureLabel('手势 · 已开启', 'Palm · Fist · Two Hands');
      setGuide('hand');
      requestAnimationFrame(gestureTick);
    }catch(err){
      releaseStream();
      const name = (err && err.name) || '';
      const msg = String((err && err.message) || '');
      if(name === 'NotAllowedError' || name === 'PermissionDeniedError'){
        setGestureLabel('手势 · 未授权');
      }else if(/import|fetch|network|Failed|load/i.test(msg)){
        setGestureLabel('手势 · 需联网');
      }else{
        setGestureLabel('手势 · 未开启');
      }
      console.warn('gesture unavailable:', name, msg);
      setTimeout(() => { if(!gesture.on && !gesture.busy) setGestureLabel('手势控制', 'Gesture · Camera'); }, 3600);
    }
    gesture.busy = false;
    gestureEl.classList.remove('busy');
  }

  function stopGesture(){
    releaseStream();
    gesture.busy = false;
    gestureEl.classList.remove('busy');
    setGestureLabel('手势控制', 'Gesture · Camera');
    setGuide('mouse');
  }

  function gestureTick(){
    if(!gesture.on) return;
    const now = performance.now();
    const v = gesture.video;
    if(v && v.readyState >= 2 && gesture.landmarker &&
       now - gesture.lastDetect > 40 && v.currentTime !== gesture.lastVideoTime){
      gesture.lastDetect = now;
      gesture.lastVideoTime = v.currentTime;
      try{
        readHand(gesture.landmarker.detectForVideo(v, now), now);
      }catch(err){}
    }
    requestAnimationFrame(gestureTick);
  }

  function fingerUp(lm, tip, pip){
    const wx = lm[0].x, wy = lm[0].y;
    const dTip = Math.hypot(lm[tip].x - wx, lm[tip].y - wy);
    const dPip = Math.hypot(lm[pip].x - wx, lm[pip].y - wy);
    return dTip > dPip * 1.10;
  }

  /* how many of the four fingers are actually held up */
  function fingersUp(lm){
    return (fingerUp(lm, 8, 6) ? 1 : 0) + (fingerUp(lm, 12, 10) ? 1 : 0) +
           (fingerUp(lm, 16, 14) ? 1 : 0) + (fingerUp(lm, 20, 18) ? 1 : 0);
  }

  function palmOf(lm){
    let x = 0, y = 0;
    for(const i of [0, 5, 9, 13, 17]){ x += lm[i].x; y += lm[i].y; }
    x /= 5; y /= 5;
    const size = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y) + .001;
    return { x, y, size };
  }

  function readHand(res, now){
    const list = (res && res.landmarks) || [];
    const hands = [];
    for(const h of list){
      if(h && h.length >= 21 && hands.length < 2) hands.push(h);
    }
    if(!hands.length){
      if(gesture.has && now - gesture.lastSeen > 800){
        gesture.has = false;
        gesture.pose = 'none';
        gesture.hist.length = 0;
        gesture.aimLight = -1;
        gesture.aimDone = -1;
      }
      if(now - gesture.twoAt > 500) gesture.spreadTarget = 1;
      gesture.ratio += (2.2 - gesture.ratio) * .08;
      return;
    }

    /* two closed hands, held steady for a moment, send the scroll back to
       its beginning — the same as pressing 重置画卷 */
    if(hands.length === 2){
      const nA = fingersUp(hands[0]), nB = fingersUp(hands[1]);
      if(nA === 0 && nB === 0){
        if(!gesture.bothFistAt) gesture.bothFistAt = now;
        if(!gesture.bothFistFired && now - gesture.bothFistAt > 900 &&
           now - gesture.lastReset > 3200){
          gesture.bothFistFired = true;
          gesture.lastReset = now;
          gesture.noPlant = now + 2600;
          resetPainting();
        }
      }else{
        gesture.bothFistAt = 0;
        gesture.bothFistFired = false;
      }
    }else{
      gesture.bothFistAt = 0;
      gesture.bothFistFired = false;
    }

    /* with two hands, keep steering with the palm nearest where the bee
       already is, so the pointer never hops between hands */
    let lm = hands[0];
    if(hands.length === 2){
      const a = palmOf(hands[0]), b = palmOf(hands[1]);
      const ax = clamp((1 - a.x - .16) / .68, 0, 1), ay = clamp((a.y - .16) / .68, 0, 1);
      const bx = clamp((1 - b.x - .16) / .68, 0, 1), by = clamp((b.y - .16) / .68, 0, 1);
      if(gesture.tx >= 0){
        const da = Math.hypot(ax - gesture.tx, ay - gesture.ty);
        const db = Math.hypot(bx - gesture.tx, by - gesture.ty);
        if(db < da) lm = hands[1];
      }
      /* palm-to-palm distance in hand-lengths: palms brought together
         gather the swarm into a ball; palms drawn apart send it roving */
      const ratio = Math.hypot(a.x - b.x, a.y - b.y) / ((a.size + b.size) * .5);
      gesture.ratio += (ratio - gesture.ratio) * .25;
      const r = clamp((gesture.ratio - 1.6) / 2.0, 0, 1);
      gesture.spreadTarget = .45 + 1.45 * r;
      gesture.twoAt = now;
    }else{
      if(now - gesture.twoAt > 500) gesture.spreadTarget = 1;
      gesture.ratio += (2.2 - gesture.ratio) * .08;
    }

    const idx = fingerUp(lm, 8, 6);
    const n = fingersUp(lm);
    let cls = 'other';
    if(n >= 4) cls = 'open';
    else if(n === 0) cls = 'fist';
    else if(n === 1 && idx) cls = 'point';
    pushPose(cls, now);

    /* an open palm steers from its centre; a pointing finger from its tip */
    let sx, sy;
    if(gesture.pose === 'point'){
      sx = lm[8].x; sy = lm[8].y;
    }else{
      sx = 0; sy = 0;
      for(const i of [0, 5, 9, 13, 17]){ sx += lm[i].x; sy += lm[i].y; }
      sx /= 5; sy /= 5;
    }

    /* the camera preview is mirrored, so mirror the reading too */
    const hx = 1 - sx;
    gesture.tx = clamp((hx - .16) / .68, 0, 1);
    gesture.ty = clamp((sy - .16) / .68, 0, 1);
    gesture.has = true;
    gesture.seen = true;
    gesture.lastSeen = now;
  }

  /* a pose is accepted only once most of the last few frames agree */
  function pushPose(cls, now){
    const hist = gesture.hist;
    hist.push(cls);
    if(hist.length > 4) hist.shift();
    if(hist.length < 3) return;
    const c = {};
    for(const k of hist) c[k] = (c[k] || 0) + 1;
    let best = 'other', bestN = 0;
    for(const k in c){
      if(k !== 'other' && c[k] > bestN){ best = k; bestN = c[k]; }
    }
    if(bestN >= 3) commitPose(best, now);
  }

  function commitPose(p, now){
    if(p === gesture.pose) return;
    const prev = gesture.pose;
    gesture.pose = p;
    gesture.poseAt = now;

    /* a rhythm of opening and closing the palm makes the ground grow */
    if((prev === 'fist' && p === 'open') || (prev === 'open' && p === 'fist')){
      const gap = now - gesture.lastFlap;
      gesture.lastFlap = now;
      /* opening the hands after a two-fist reset is not a planting beat */
      if(gap < 1800 && now >= gesture.noPlant) plantFromHand(now);
    }
  }

  function plantFromHand(now){
    if(now - gesture.lastPlant < 160) return;
    if(pointer.x < 0 || !pointer.inCanvas) return;
    const w = screenToWorld(pointer.x, pointer.y);
    if(!isValidGround(w.x, w.y)) return;
    gesture.lastPlant = now;
    for(let i = 0; i < 2; i++){
      const ox = (Math.random() - .5) * 38;
      const oy = (Math.random() - .5) * 20;
      if(isValidGround(w.x + ox, w.y + oy)) spawnPlant(w.x + ox, w.y + oy);
    }
  }

  /* pointing at a light for a moment opens its small picture */
  function updateGestureAim(now){
    if(!gesture.on || !pointer.inCanvas) return;
    const hit = (gesture.has && gesture.pose === 'point')
      ? shimmerHit(pointer.x, pointer.y) : -1;
    if(hit < 0){ gesture.aimLight = -1; gesture.aimDone = -1; return; }
    if(gesture.aimDone === hit) return;
    if(gesture.aimLight !== hit){
      gesture.aimLight = hit;
      gesture.aimSince = now;
      return;
    }
    if(now - gesture.aimSince > 360 && now - gesture.lastClick > 800){
      gesture.lastClick = now;
      gesture.aimDone = hit;
      handClick();
    }
  }

  function handClick(){
    const x = pointer.x, y = pointer.y;
    if(x < 0 || y < 0) return;
    pointerTouch = false;
    const mk = (type, buttons) => new PointerEvent(type, {
      bubbles:true, cancelable:true, composed:true,
      pointerId:77, pointerType:'mouse', isPrimary:true,
      clientX:x, clientY:y, button:0, buttons
    });
    canvas.dispatchEvent(mk('pointerdown', 1));
    setTimeout(() => window.dispatchEvent(mk('pointerup', 0)), 90);
    gvidEl.classList.add('flash');
    setTimeout(() => gvidEl.classList.remove('flash'), 240);
  }

  function updateGesturePointer(now, dt){
    if(!gesture.on) return;
    const held = gesture.pose === 'fist';
    if(gesture.has && gesture.tx >= 0 && !held){
      pointer.inCanvas = true;
      pointerTouch = false;
      if(pointer.x < 0){ pointer.x = gesture.tx * cssW; pointer.y = gesture.ty * cssH; }
      const k = Math.min(1, dt * 5.2);
      pointer.x += (gesture.tx * cssW - pointer.x) * k;
      pointer.y += (gesture.ty * cssH - pointer.y) * k;
    }else if(pointer.inCanvas && gesture.seen && now - gesture.lastSeen > 1400 &&
             now - gesture.mouseAt > 1500){
      /* the hand has left the frame: let the bee settle and the lens close,
         then hand the pointer back to the mouse until a hand returns */
      onPointerLeave();
      gesture.seen = false;
    }
  }

  gestureEl.addEventListener('click', () => {
    if(gesture.on) stopGesture(); else startGesture();
  });

  /* resetting the scroll: the ground is cleared and the paper runs back to
     its beginning, so the four seasons can be walked again from the start */
  function resetPainting(){
    const now = performance.now();
    for(const pl of plants){
      if(!pl.dying) pl.dying = now + Math.random()*160;
    }
    ripples.length = 0;
    swarms.length = 0;
    beeCooldown = now + 5000;
    counts = { herb:0, flower:0, wood:0 };
    setCounts();
    plantLayerDirty = true;
    clearReveal();
    hintEl.classList.remove('hide');
    setSeason(0);
    /* the hand that asked for the reset is still where it was: the paper
       stays home until it truly moves again */
    scrollFreeze = { x: pointer.x, y: pointer.y };
  }

  resetEl.addEventListener('click', resetPainting);

  /* ------------------------------------------------------------
     Seasons turn with the scroll position, never with a click
  ------------------------------------------------------------ */
  function updateSeasonUI(){
    if(!seasonsEl) return;
    for(const el of seasonsEl.querySelectorAll('.season')){
      el.classList.toggle('on', (+el.dataset.season) === SEASON);
    }
  }

  function applyDominantSeason(i){
    i = clamp(i | 0, 0, 3);
    if(i === SEASON) return;
    SEASON = i;
    FOG = SEASON_FOG[i].slice();
    if(i === 3) swarms.length = 0;
    plantLayerDirty = true;
    revealDirty = true;
    if(noteOpen >= 0 && STORY[noteOpen].s !== i) closeNote();
    reseedSeasonFX();
    updateSeasonUI();
  }

  function setSeason(i){
    i = clamp(i | 0, 0, 3);
    camX = clamp(i * tileStep(), 0, camMax());
    camVel = 0;
    lastProgress = camMax() > 0 ? camX / camMax() : 0;
    scrollProgress = lastProgress;
    seasonFloat = i;
    applyDominantSeason(i);
    revealDirty = true;
    updateSeasonUI();
  }

  /* ------------------------------------------------------------
     Story lights
     Four breathing glimmers, one per season, resting in the quiet
     air of their own part of the scroll. Coming near one of them
     slowly enlarges only that small patch of the painting; a click
     opens a quiet first-person note. Nothing else changes scale.
  ------------------------------------------------------------ */
  const STORY = [
    { s:0, x:.380, y:.620, cap:'春 · 成长', lead:'我从一枚卵开始。',
      text:'我经历卵、幼虫和蛹，才成为一只会飞的蜜蜂。最初我留在巢内，从清洁巢房、照顾幼虫开始，慢慢认识这个由花香、薄雾和伙伴组成的世界。' },
    { s:1, x:.455, y:.720, cap:'夏 · 采蜜', lead:'循着花香，我飞出巢去。',
      text:'留坝山林里有丰富的野山花。我靠近花朵，用口器吸食花蜜，花粉也沾在身上。采到花蜜后，我把它带回蜂巢，交给伙伴们继续酿造。' },
    { s:2, x:.705, y:.455, cap:'秋 · 储蜜', lead:'花蜜要慢慢变成蜂蜜。',
      text:'采回来的花蜜还不是成熟的蜂蜜。伙伴们反复传递花蜜，让酶充分混合，再一起扇动翅膀带走水分。花蜜慢慢成熟，被储进巢房。留坝棒棒蜜采用中华蜂和传统棒棒桶定点养殖，酿蜜周期长，通常一年只取一次蜜。' },
    { s:3, x:.778, y:.700, cap:'冬 · 越冬', lead:'我们把花香留给冬天。',
      text:'天气冷下来，我们不再频繁出巢，而是在巢内结成蜂团，彼此取暖。外层的伙伴和里层的伙伴会缓慢交换位置，靠秋天存下的蜂蜜度过漫长的冬天。' }
  ];
  const GLOW_PERIOD = [5200, 4800, 5600, 5000];

  /* a light belongs to one season and only exists in that season's view;
     it fades out as the scroll crosses into the neighbouring season */
  function shimmerVis(i){
    const d = Math.min(seasonFloat - (i - .5), (i + .5) - seasonFloat);
    return clamp(d * 5, 0, 1);
  }

  const noteEl = document.getElementById('note');
  const noteCapEl = document.getElementById('noteCap');
  const noteLeadEl = document.getElementById('noteLead');
  const noteTextEl = document.getElementById('noteText');
  const glowcapEl = document.getElementById('glowcap');
  const glowcapCapEl = document.getElementById('glowcapCap');
  const glowcapTextEl = document.getElementById('glowcapText');

  let noteOpen = -1, shimHot = -1, cursorIsPointer = false;
  let noteAwaySince = 0;
  const NOTE_AWAY_R = 210, NOTE_AWAY_MS = 1000;

  /* each light rests in its own stretch of the scroll, so it is carried
     along by the unrolling rather than pinned to the frame */
  function shimmerAt(i){
    const wx = tileShift(i) + STORY[i].x * W;
    const wy = STORY[i].y * H;
    return { x: ox + wx * scale - camX, y: oy + wy * scale };
  }

  function shimmerHit(x, y){
    let best = -1, bd = Infinity;
    for(let i = 0; i < STORY.length; i++){
      if(shimmerVis(i) < .55) continue;
      const p = shimmerAt(i);
      const rr = i === noteOpen ? 46 : 30;
      const dx = x - p.x, dy = y - p.y, d = dx*dx + dy*dy;
      if(d <= rr*rr && d < bd){ bd = d; best = i; }
    }
    return best;
  }

  function overNote(x, y){
    if(noteOpen < 0 || !noteEl) return false;
    const l = noteEl.offsetLeft, t = noteEl.offsetTop;
    const w = noteEl.offsetWidth, hh = noteEl.offsetHeight;
    const m = 22;
    return x >= l - m && x <= l + w + m && y >= t - m && y <= t + hh + m;
  }

  /* the card sits beside the lens, in whichever side has room */
  function placeNote(){
    if(noteOpen < 0 || !noteEl) return;
    const p = shimmerAt(noteOpen);
    const w = noteEl.offsetWidth, hh = noteEl.offsetHeight;
    const gap = lensRadius() * 1.26 + 24;
    const m = 18, topSafe = 92, botSafe = 84;
    const cx = clamp(p.x - w * .5, m, Math.max(m, cssW - w - m));
    const cands = [
      { l: p.x + gap, t: p.y - hh * .5, side: true },
      { l: p.x - gap - w, t: p.y - hh * .5, side: true },
      { l: cx, t: p.y + gap, side: false },
      { l: cx, t: p.y - gap - hh, side: false }
    ];
    let pick = null;
    for(const c of cands){
      const xOk = !c.side || (c.l >= m && c.l + w <= cssW - m);
      if(xOk && c.t >= topSafe && c.t + hh <= cssH - botSafe){
        pick = c; break;
      }
    }
    if(!pick){
      pick = {
        l: clamp(cands[0].l, m, Math.max(m, cssW - w - m)),
        t: clamp(cands[0].t, topSafe, Math.max(topSafe, cssH - hh - botSafe))
      };
    }
    noteEl.style.left = Math.round(pick.l) + 'px';
    noteEl.style.top = Math.round(pick.t) + 'px';
  }

  function placeGlowCap(i){
    if(!glowcapEl) return;
    const p = shimmerAt(i);
    const hh = glowcapEl.offsetHeight || 34;
    const off = lensRadius() * 1.02 + 26;
    const w = glowcapEl.offsetWidth || 150;
    let top = p.y + off;
    if(top + hh > cssH - 76) top = p.y - off - hh;
    top = clamp(top, 80, Math.max(80, cssH - hh - 72));
    const left = clamp(p.x, 96, Math.max(96, cssW - 96));
    /* the words never run into the little gesture plate in the corner:
       if they would, they move to the quiet air above the light instead */
    const hits = el => {
      if(!el) return false;
      const r = el.getBoundingClientRect();
      return left + w/2 + 14 > r.left && left - w/2 - 14 < r.right &&
             top + hh + 10 > r.top && top - 10 < r.bottom;
    };
    if(hits(gestureEl) || hits(resetEl) || hits(soundEl)){
      top = clamp(p.y - off - hh, 80, Math.max(80, cssH - hh - 72));
    }
    glowcapEl.style.left = Math.round(left) + 'px';
    glowcapEl.style.top = Math.round(top) + 'px';
  }

  function setGlowCap(i){
    if(!glowcapEl) return;
    if(i < 0){ glowcapEl.classList.remove('on'); return; }
    glowcapCapEl.textContent = STORY[i].cap;
    glowcapTextEl.textContent = STORY[i].lead;
    placeGlowCap(i);
    glowcapEl.classList.add('on');
  }

  function openNote(i){
    if(!noteEl) return;
    const st = STORY[i];
    noteOpen = i;
    noteAwaySince = 0;
    noteCapEl.textContent = st.cap;
    noteLeadEl.textContent = st.lead;
    noteTextEl.textContent = st.text;
    noteEl.classList.add('on');
    noteEl.setAttribute('aria-hidden', 'false');
    placeNote();
    if(glowcapEl) glowcapEl.classList.remove('on');
  }

  function closeNote(){
    if(noteOpen < 0) return;
    noteOpen = -1;
    noteAwaySince = 0;
    if(noteEl){
      noteEl.classList.remove('on');
      noteEl.setAttribute('aria-hidden', 'true');
    }
  }

  function toggleNote(i){ if(noteOpen === i) closeNote(); else openNote(i); }

  function updateStoryHover(now){
    const inside = pointer.inCanvas;
    const hot = (inside && !pointer.down) ? shimmerHit(pointer.x, pointer.y) : -1;
    shimHot = hot;

    const want = hot >= 0;
    if(want !== cursorIsPointer){
      cursorIsPointer = want;
      canvas.style.cursor = want ? 'pointer' : '';
    }

    if(hot >= 0){
      noteAwaySince = 0;
      if(noteOpen === hot){
        if(glowcapEl) glowcapEl.classList.remove('on');
      } else {
        setGlowCap(hot);
      }
    } else {
      if(glowcapEl) glowcapEl.classList.remove('on');
      if(noteOpen >= 0){
        const p = shimmerAt(noteOpen);
        const away = !inside ||
          (Math.hypot(pointer.x - p.x, pointer.y - p.y) > NOTE_AWAY_R &&
           !overNote(pointer.x, pointer.y));
        if(away){
          if(!noteAwaySince) noteAwaySince = now;
          else if(now - noteAwaySince > NOTE_AWAY_MS) closeNote();
        } else {
          noteAwaySince = 0;
        }
      }
    }

    lensWant = hot >= 0 ? hot : noteOpen;
  }

  /* ------------------------------------------------------------
     The local lens
     One soft patch is sampled from the finished frame and eased
     back at 1.26x. The painting itself is never redrawn, rescaled
     or moved.
  ------------------------------------------------------------ */
  let lensT = 0, lensIdx = -1, lensWant = -1;
  const lensCanvas = document.createElement('canvas');
  const lensctx = lensCanvas.getContext('2d');

  function lensRadius(){
    return clamp(Math.min(cssW, cssH) * .134, 56, 122);
  }

  function updateLens(dt){
    const inRate = 1 - Math.pow(.13, dt);
    const outRate = 1 - Math.pow(.22, dt);
    if(lensWant >= 0){
      if(lensIdx >= 0 && lensIdx !== lensWant){
        lensT += (0 - lensT) * outRate;
        if(lensT < .02){ lensT = 0; lensIdx = -1; }
      } else {
        lensIdx = lensWant;
        lensT += (1 - lensT) * inRate;
      }
    } else {
      lensT += (0 - lensT) * outRate;
      if(lensT < .006){ lensT = 0; lensIdx = -1; }
    }
  }

  /* ------------------------------------------------------------
     Four small close-ups of what is really happening inside the
     light: brood being tended, a bee on the wildflowers, nectar
     ripening in the comb, the winter cluster. Painted once in the
     scroll's own palette, then held inside the soft patch.
  ------------------------------------------------------------ */
  const PLATE_N = 640;
  const detailPlates = [null, null, null, null];

  function plateWash(g, c0, c1, warm){
    const grd = g.createLinearGradient(0, 0, PLATE_N * .5, PLATE_N);
    grd.addColorStop(0, c0);
    grd.addColorStop(1, c1);
    g.fillStyle = grd;
    g.fillRect(0, 0, PLATE_N, PLATE_N);
    const lg = g.createRadialGradient(PLATE_N * .40, PLATE_N * .30, 10, PLATE_N * .5, PLATE_N * .52, PLATE_N * .82);
    lg.addColorStop(0, warm);
    lg.addColorStop(.55, 'rgba(255,246,222,.10)');
    lg.addColorStop(1, 'rgba(255,246,222,0)');
    g.fillStyle = lg;
    g.fillRect(0, 0, PLATE_N, PLATE_N);
  }

  function soften(c, g, px, alpha){
    g.save();
    g.globalAlpha = alpha;
    if(g.filter !== undefined) g.filter = 'blur(' + px + 'px)';
    g.drawImage(c, 0, 0);
    if(g.filter !== undefined) g.filter = 'none';
    g.restore();
  }

  function softEdge(c, g, amount){
    const b = document.createElement('canvas');
    b.width = b.height = PLATE_N;
    const bg = b.getContext('2d');
    if(bg.filter !== undefined) bg.filter = 'blur(' + amount + 'px)';
    bg.drawImage(c, 0, 0);
    if(bg.filter !== undefined) bg.filter = 'none';
    bg.globalCompositeOperation = 'destination-in';
    const m = bg.createRadialGradient(PLATE_N / 2, PLATE_N / 2, PLATE_N * .28, PLATE_N / 2, PLATE_N / 2, PLATE_N * .52);
    m.addColorStop(0, 'rgba(0,0,0,0)');
    m.addColorStop(.45, 'rgba(0,0,0,.45)');
    m.addColorStop(1, 'rgba(0,0,0,1)');
    bg.fillStyle = m;
    bg.fillRect(0, 0, PLATE_N, PLATE_N);
    g.drawImage(b, 0, 0);
  }

  function plateFinish(c, g, dark){
    const rnd = mulberry32(9137);
    for(let i = 0; i < 900; i++){
      const x = rnd() * PLATE_N, y = rnd() * PLATE_N;
      g.fillStyle = 'rgba(66,54,38,' + (.010 + rnd() * .040).toFixed(3) + ')';
      g.fillRect(x, y, 1.1, 1.1);
    }
    const vg = g.createRadialGradient(PLATE_N / 2, PLATE_N / 2, PLATE_N * .34, PLATE_N / 2, PLATE_N / 2, PLATE_N * .74);
    vg.addColorStop(0, 'rgba(26,22,15,0)');
    vg.addColorStop(.7, 'rgba(26,22,15,' + (dark * .38).toFixed(3) + ')');
    vg.addColorStop(1, 'rgba(26,22,15,' + dark.toFixed(3) + ')');
    g.fillStyle = vg;
    g.fillRect(0, 0, PLATE_N, PLATE_N);
  }

  function hexPath(g, x, y, r){
    g.beginPath();
    for(let k = 0; k < 6; k++){
      const a = Math.PI / 6 + k * Math.PI / 3;
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      if(k === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
  }

  function cellBody(g, x, y, r){
    hexPath(g, x, y, r);
    const grd = g.createRadialGradient(x, y - r * .22, r * .1, x, y, r * 1.02);
    grd.addColorStop(0, 'rgba(198,168,114,.99)');
    grd.addColorStop(.58, 'rgba(168,136,86,.99)');
    grd.addColorStop(1, 'rgba(116,88,50,.99)');
    g.fillStyle = grd;
    g.fill();
    g.strokeStyle = 'rgba(88,64,36,.44)';
    g.lineWidth = Math.max(1.6, r * .050);
    g.stroke();
    g.save();
    hexPath(g, x, y, r);
    g.clip();
    const sh = g.createLinearGradient(x, y - r, x, y + r * .18);
    sh.addColorStop(0, 'rgba(58,42,24,.40)');
    sh.addColorStop(1, 'rgba(58,42,24,0)');
    g.fillStyle = sh;
    g.fillRect(x - r, y - r, r * 2, r * 2);
    g.restore();
    g.strokeStyle = 'rgba(255,244,214,.20)';
    g.lineWidth = 1.1;
    hexPath(g, x, y + 1.6, r - 3);
    g.stroke();
  }

  function cappedCell(g, x, y, r){
    cellBody(g, x, y, r);
    hexPath(g, x, y, r - 2.4);
    g.fillStyle = 'rgba(224,206,164,.98)';
    g.fill();
    const hl = g.createRadialGradient(x - r * .3, y - r * .36, 2, x, y, r * .95);
    hl.addColorStop(0, 'rgba(255,250,232,.72)');
    hl.addColorStop(.45, 'rgba(244,234,204,.24)');
    hl.addColorStop(1, 'rgba(210,186,140,0)');
    g.fillStyle = hl;
    g.fill();
    g.strokeStyle = 'rgba(122,96,58,.30)';
    g.lineWidth = 1.2;
    hexPath(g, x, y, r - 2.4);
    g.stroke();
    // faint wax fibres
    g.strokeStyle = 'rgba(255,250,232,.16)';
    g.lineWidth = 1;
    for(let i = 0; i < 3; i++){
      g.beginPath();
      g.arc(x, y, r * (.30 + i * .16), .4, 1.5);
      g.stroke();
    }
  }

  function nectarCell(g, x, y, r, deep){
    cellBody(g, x, y, r);
    hexPath(g, x, y, r - 3);
    const grd = g.createRadialGradient(x - r * .22, y - r * .30, 2, x, y, r);
    grd.addColorStop(0, deep ? 'rgba(214,144,44,.99)' : 'rgba(236,176,70,.99)');
    grd.addColorStop(.62, deep ? 'rgba(162,98,30,.99)' : 'rgba(196,132,44,.99)');
    grd.addColorStop(1, 'rgba(108,66,20,.99)');
    g.fillStyle = grd;
    g.fill();
    g.strokeStyle = 'rgba(255,232,176,.36)';
    g.lineWidth = 1.4;
    hexPath(g, x, y, r - 3);
    g.stroke();
    g.fillStyle = 'rgba(255,246,208,.50)';
    g.beginPath();
    g.ellipse(x - r * .26, y - r * .34, r * .18, r * .05, -.55, 0, TAU);
    g.fill();
    g.strokeStyle = 'rgba(255,234,182,.20)';
    g.lineWidth = 1;
    g.beginPath();
    g.ellipse(x, y + r * .10, r * .44, r * .13, 0, .15, Math.PI - .15);
    g.stroke();
  }

  function eggIn(g, x, y, r){
    const spans = [[-.16, -.06], [.06, .10]];
    for(const s of spans){
      g.fillStyle = 'rgba(252,250,242,.96)';
      g.beginPath();
      g.ellipse(x + s[0] * r, y + r * .22, r * .075, r * .30, s[1], 0, TAU);
      g.fill();
      g.fillStyle = 'rgba(214,198,164,.28)';
      g.beginPath();
      g.ellipse(x + s[0] * r + 1.4, y + r * .28, r * .05, r * .20, s[1], 0, TAU);
      g.fill();
    }
  }

  function larvaIn(g, x, y, r, fat){
    const rad = r * (.24 + fat * .05);
    const n = 6;
    const baseX = x, baseY = y + r * .06;
    const pts = [];
    for(let i = 0; i < n; i++){
      const a = Math.PI * (1.18 - i * .19);
      const rr = rad * (.92 + .22 * Math.sin(i / (n - 1) * Math.PI));
      pts.push({
        x: baseX + Math.cos(a) * rr * 1.10,
        y: baseY + Math.sin(a) * rr * .86,
        r: r * (.082 + fat * .030) * (.70 + .42 * Math.sin(i / (n - 1) * Math.PI))
      });
    }
    // soft shadow
    g.fillStyle = 'rgba(92,68,34,.22)';
    for(const p of pts){
      g.beginPath();
      g.arc(p.x + 2, p.y + 3.4, p.r * 1.05, 0, TAU);
      g.fill();
    }
    for(const p of pts){
      const grd = g.createRadialGradient(p.x - p.r * .34, p.y - p.r * .38, 1, p.x, p.y, p.r * 1.1);
      grd.addColorStop(0, 'rgba(255,250,236,.99)');
      grd.addColorStop(.62, 'rgba(248,238,214,.99)');
      grd.addColorStop(1, 'rgba(224,204,166,.99)');
      g.fillStyle = grd;
      g.beginPath();
      g.arc(p.x, p.y, p.r, 0, TAU);
      g.fill();
    }
    g.strokeStyle = 'rgba(150,120,76,.24)';
    g.lineWidth = 1;
    for(let i = 1; i < n; i++){
      g.beginPath();
      g.arc((pts[i].x + pts[i - 1].x) / 2, (pts[i].y + pts[i - 1].y) / 2, pts[i].r * .82, 0, TAU);
      g.stroke();
    }
  }

  function pupaIn(g, x, y, r){
    g.save();
    g.translate(x, y + r * .10);
    g.rotate(-.16);
    // shadow in the cell
    g.fillStyle = 'rgba(92,68,34,.20)';
    g.beginPath();
    g.ellipse(3, r * .16, r * .20, r * .40, 0, 0, TAU);
    g.fill();
    // abdomen, tapering
    for(let i = 0; i < 5; i++){
      const t = i / 4;
      const w = r * (.185 - t * .085);
      const yy = r * .02 + t * r * .42;
      const grd = g.createLinearGradient(-w, yy, w, yy);
      grd.addColorStop(0, 'rgba(238,222,186,.99)');
      grd.addColorStop(.6, 'rgba(250,240,214,.99)');
      grd.addColorStop(1, 'rgba(220,198,158,.99)');
      g.fillStyle = grd;
      g.beginPath();
      g.ellipse(0, yy, w, r * .105, 0, 0, TAU);
      g.fill();
      g.strokeStyle = 'rgba(150,120,74,.22)';
      g.lineWidth = 1;
      g.beginPath();
      g.ellipse(0, yy + r * .055, w * .94, r * .055, 0, .15, Math.PI - .15);
      g.stroke();
    }
    // thorax
    g.fillStyle = 'rgba(244,232,202,.99)';
    g.beginPath();
    g.ellipse(0, -r * .13, r * .155, r * .135, 0, 0, TAU);
    g.fill();
    // folded wing pads
    g.fillStyle = 'rgba(228,212,178,.75)';
    g.beginPath();
    g.ellipse(-r * .10, -r * .04, r * .075, r * .17, -.16, 0, TAU);
    g.fill();
    g.beginPath();
    g.ellipse(r * .10, -r * .04, r * .075, r * .17, .16, 0, TAU);
    g.fill();
    // head with developing eyes
    g.fillStyle = 'rgba(236,222,190,.99)';
    g.beginPath();
    g.arc(0, -r * .34, r * .135, 0, TAU);
    g.fill();
    g.fillStyle = 'rgba(96,74,46,.55)';
    g.beginPath();
    g.ellipse(-r * .062, -r * .365, r * .040, r * .050, .2, 0, TAU);
    g.fill();
    g.beginPath();
    g.ellipse(r * .062, -r * .365, r * .040, r * .050, -.2, 0, TAU);
    g.fill();
    g.restore();
  }

  function hatchCell(g, x, y, r){
    const rnd = mulberry32((x * 31 + y * 17) | 0);
    g.beginPath();
    const n = 13;
    for(let i = 0; i < n; i++){
      const a = i / n * TAU;
      const rr = r * (.44 + rnd() * .13);
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      if(i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
    g.fillStyle = 'rgba(54,38,22,.86)';
    g.fill();
    // young bee climbing out
    g.fillStyle = 'rgba(58,44,30,.95)';
    g.beginPath();
    g.ellipse(x, y + r * .06, r * .17, r * .14, 0, 0, TAU);
    g.fill();
    g.fillStyle = 'rgba(214,176,110,.99)';
    g.beginPath();
    g.ellipse(x, y + r * .24, r * .20, r * .12, 0, 0, TAU);
    g.fill();
    g.strokeStyle = 'rgba(70,52,32,.55)';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(x - r * .06, y + r * .21); g.lineTo(x - r * .06, y + r * .30);
    g.moveTo(x + r * .07, y + r * .21); g.lineTo(x + r * .07, y + r * .30);
    g.stroke();
    g.fillStyle = 'rgba(24,20,15,.9)';
    g.beginPath();
    g.ellipse(x - r * .06, y + r * .03, r * .030, r * .036, .2, 0, TAU);
    g.fill();
    g.beginPath();
    g.ellipse(x + r * .06, y + r * .03, r * .030, r * .036, -.2, 0, TAU);
    g.fill();
    // torn wax rim
    g.strokeStyle = 'rgba(248,238,208,.65)';
    g.lineWidth = 2.2;
    g.beginPath();
    const m2 = 13;
    for(let i = 0; i < m2; i++){
      const a = i / m2 * TAU;
      const rr = r * (.45 + rnd() * .12);
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      if(i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
    g.stroke();
  }

  function bigBee(g, x, y, ang, s, flap, opts){
    opts = opts || {};
    g.save();
    g.translate(x, y);
    g.rotate(ang);
    g.scale(s, s);
    g.lineCap = 'round';
    g.save();
    g.globalAlpha = .20;
    g.fillStyle = 'rgba(40,30,18,1)';
    g.beginPath();
    g.ellipse(0, 10, 24, 7.5, 0, 0, TAU);
    g.fill();
    g.restore();
    // legs
    g.strokeStyle = 'rgba(58,46,30,.66)';
    g.lineWidth = 1.6;
    g.beginPath();
    g.moveTo(-6, -7); g.lineTo(-12, -13); g.lineTo(-16, -12);
    g.moveTo(1, -9); g.lineTo(-2, -16); g.lineTo(-6, -19);
    g.moveTo(9, -7); g.lineTo(13, -14); g.lineTo(18, -17);
    g.moveTo(-6, 7); g.lineTo(-12, 13); g.lineTo(-16, 12);
    g.moveTo(1, 9); g.lineTo(-2, 16); g.lineTo(-6, 19);
    g.moveTo(9, 7); g.lineTo(13, 14); g.lineTo(18, 17);
    g.stroke();
    if(opts.pollen){
      const pr = mulberry32(881);
      for(let i = 0; i < 16; i++){
        g.fillStyle = 'rgba(244,198,86,' + (.28 + pr() * .55).toFixed(2) + ')';
        g.beginPath();
        g.arc(-7 + pr() * 28, (pr() - .5) * 17, 1.2 + pr() * 1.4, 0, TAU);
        g.fill();
      }
    }
    // abdomen
    const abd = g.createLinearGradient(-12, -10, 18, 12);
    abd.addColorStop(0, 'rgba(172,126,60,.99)');
    abd.addColorStop(.45, 'rgba(196,152,82,.99)');
    abd.addColorStop(1, 'rgba(132,92,42,.99)');
    g.fillStyle = abd;
    g.beginPath();
    g.ellipse(3, 0, 15.5, 10.6, -.04, 0, TAU);
    g.fill();
    g.strokeStyle = 'rgba(44,33,20,.86)';
    g.lineWidth = 3.8;
    g.beginPath();
    g.moveTo(-2, -10.6); g.lineTo(-2, 10.2);
    g.moveTo(7, -8.8); g.lineTo(7, 8.4);
    g.stroke();
    g.strokeStyle = 'rgba(238,210,160,.20)';
    g.lineWidth = 1;
    for(let i = 0; i < 10; i++){
      const a = (i / 10) * TAU;
      g.beginPath();
      g.moveTo(3 + Math.cos(a) * 14.4, Math.sin(a) * 9.8);
      g.lineTo(3 + Math.cos(a) * 17.6, Math.sin(a) * 12.2);
      g.stroke();
    }
    // wings, laid back over the abdomen
    const f = Math.abs(Math.sin(flap));
    g.save();
    const wg = g.createLinearGradient(-8, 0, 34, 0);
    wg.addColorStop(0, 'rgba(252,250,242,' + (.17 + f * .06).toFixed(3) + ')');
    wg.addColorStop(1, 'rgba(242,238,226,' + (.05 + f * .02).toFixed(3) + ')');
    g.fillStyle = wg;
    g.strokeStyle = 'rgba(186,174,150,.20)';
    g.lineWidth = .9;
    for(const sgn of [-1, 1]){
      g.save();
      g.translate(0, 0);
      g.rotate(sgn * (.12 + f * .07));
      g.beginPath();
      g.ellipse(11, sgn * 9.4, 21, 6.2, sgn * -.16, 0, TAU);
      g.fill();
      g.stroke();
      g.restore();
    }
    g.restore();
    // thorax
    const th = g.createLinearGradient(-16, -8, -2, 8);
    th.addColorStop(0, 'rgba(198,160,100,.99)');
    th.addColorStop(1, 'rgba(166,124,68,.99)');
    g.fillStyle = th;
    g.beginPath();
    g.ellipse(-10, 0, 9.6, 8.6, 0, 0, TAU);
    g.fill();
    g.strokeStyle = 'rgba(232,200,148,.34)';
    g.lineWidth = 1.1;
    for(let i = 0; i < 9; i++){
      const a = -.9 + i * .225;
      g.beginPath();
      g.moveTo(-10 + Math.cos(a) * 7.8, Math.sin(a) * 7.8);
      g.lineTo(-10 + Math.cos(a) * 11.4, Math.sin(a) * 11.4);
      g.stroke();
    }
    // head
    const hd = g.createRadialGradient(-21.6, -3.6, 1, -19.4, 0, 7.6);
    hd.addColorStop(0, 'rgba(96,76,52,.99)');
    hd.addColorStop(1, 'rgba(48,38,26,.99)');
    g.fillStyle = hd;
    g.beginPath();
    g.ellipse(-19.6, 0, 6.7, 5.3, 0, 0, TAU);
    g.fill();
    g.fillStyle = 'rgba(26,21,16,.86)';
    g.beginPath();
    g.ellipse(-20.8, -2.2, 2.2, 2.7, .30, 0, TAU);
    g.fill();
    g.beginPath();
    g.ellipse(-20.8, 2.2, 2.2, 2.7, -.30, 0, TAU);
    g.fill();
    g.strokeStyle = 'rgba(40,34,26,.78)';
    g.lineWidth = 1.3;
    g.beginPath();
    g.moveTo(-23, -3.4); g.quadraticCurveTo(-31, -10, -35, -8);
    g.moveTo(-23, 3.4); g.quadraticCurveTo(-31, 9, -35, 7.6);
    g.stroke();
    if(opts.fan){
      g.strokeStyle = 'rgba(246,240,222,.26)';
      g.lineWidth = 1.2;
      for(let i = 0; i < 3; i++){
        g.beginPath();
        g.arc(-20, 0, 20 + i * 5, -.8, .8);
        g.stroke();
      }
    }
    g.restore();
  }

  function combField(g, cx, cy, r, cols, rows, kinds){
    const dx = r * 1.732, dy = r * 1.5;
    for(let j = rows - 1; j >= 0; j--){
      for(let i = 0; i < cols; i++){
        const x = cx + (i - (cols - 1) / 2) * dx + (j % 2 ? dx / 2 : 0);
        const y = cy + (j - (rows - 1) / 2) * dy;
        const kind = kinds[j * cols + i] || 'cap';
        if(kind === 'cap') cappedCell(g, x, y, r);
        else if(kind === 'nectar') nectarCell(g, x, y, r, false);
        else if(kind === 'honey') nectarCell(g, x, y, r, true);
        else if(kind === 'hatch'){ cappedCell(g, x, y, r); hatchCell(g, x, y, r); }
        else {
          cellBody(g, x, y, r);
          if(kind === 'egg') eggIn(g, x, y, r);
          else if(kind === 'larva') larvaIn(g, x, y, r, .2);
          else if(kind === 'larva2') larvaIn(g, x, y, r, .9);
          else if(kind === 'pupa') pupaIn(g, x, y, r);
        }
      }
    }
  }

    const rnd = mulberry32(2213);
    const kinds = [];
    for(let i = 0; i < 90; i++){
      const q = rnd();
      kinds.push(q < .42 ? 'cap' : q < .58 ? 'nectar' : q < .84 ? 'cap' : 'empty');
    }
    kinds[4 * 10 + 2] = 'egg';
    kinds[4 * 10 + 3] = 'larva';
    kinds[4 * 10 + 4] = 'larva2';
    kinds[4 * 10 + 5] = 'pupa';
    kinds[4 * 10 + 6] = 'hatch';
    kinds[2 * 10 + 3] = 'larva2';
    kinds[6 * 10 + 5] = 'pupa';
    kinds[6 * 10 + 2] = 'egg';
    combField(g, 350, 320, 52, 10, 9, kinds);
    bigBee(g, 176, 486, -1.10, 2.10, 1.4, {});
    bigBee(g, 452, 512, -2.02, 1.85, 2.6, {});
    bigBee(g, 112, 262, -.30, 1.45, .7, {});
    soften(c, g, 1.4, .20);

    return c;

  function clusterMass(g, cx, cy, rx, ry, seed){
    const rnd = mulberry32(seed || 5501);
    const base = g.createRadialGradient(cx - rx * .25, cy - ry * .35, 8, cx, cy, rx * 1.06);
    base.addColorStop(0, 'rgba(96,74,46,.98)');
    base.addColorStop(.55, 'rgba(64,50,32,.99)');
    base.addColorStop(1, 'rgba(20,17,13,.99)');
    g.fillStyle = base;
    g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, TAU); g.fill();
    const bodies = [];
    for(let i = 0; i < 216; i++){
      const a = rnd() * TAU;
      const rr = i < 196 ? Math.pow(rnd(), 1.42) : .96 + rnd() * .12;
      bodies.push({
        x: cx + Math.cos(a) * rx * rr * .99,
        y: cy + Math.sin(a) * ry * rr * .95,
        s: .50 + rnd() * .54,
        a: rnd() * TAU,
        k: .40 + rnd() * .58
      });
    }
    bodies.sort((p, q) => p.y - q.y);
    for(const bo of bodies){
      const s2 = bo.s, k = bo.k;
      g.save();
      g.translate(bo.x, bo.y);
      g.rotate(bo.a);
      g.scale(s2, s2);
      const grd = g.createRadialGradient(-8, -10, 1, 0, 0, 28);
      grd.addColorStop(0, 'rgba(' + Math.round(238 * k) + ',' + Math.round(200 * k) + ',' + Math.round(134 * k) + ',.97)');
      grd.addColorStop(.55, 'rgba(' + Math.round(178 * k) + ',' + Math.round(136 * k) + ',' + Math.round(82 * k) + ',.97)');
      grd.addColorStop(1, 'rgba(92,68,42,.97)');
      g.fillStyle = grd;
      g.beginPath();
      g.ellipse(0, 0, 24, 17, 0, 0, TAU);
      g.fill();
      g.strokeStyle = 'rgba(48,34,20,.32)';
      g.lineWidth = 3.2;
      g.beginPath(); g.moveTo(-6, -14.6); g.quadraticCurveTo(1, 0, -6, 14.6); g.stroke();
      g.beginPath(); g.moveTo(8, -12.2); g.quadraticCurveTo(14, 0, 8, 12.2); g.stroke();
      g.fillStyle = 'rgba(62,47,30,.55)';
      g.beginPath(); g.ellipse(-19, 0, 6.0, 5.0, 0, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(232,204,154,.15)';
      g.lineWidth = 1.1;
      for(let q = 0; q < 10; q++){
        const aq = q / 10 * TAU;
        g.beginPath();
        g.moveTo(Math.cos(aq) * 22, Math.sin(aq) * 15.5);
        g.lineTo(Math.cos(aq) * 26.5, Math.sin(aq) * 19.2);
        g.stroke();
      }
      g.restore();
    }
    g.strokeStyle = 'rgba(234,208,158,.15)';
    g.lineWidth = 1.1;
    for(let i = 0; i < 150; i++){
      const a2 = rnd() * TAU;
      const px = cx + Math.cos(a2) * rx * (.93 + rnd() * .13);
      const py = cy + Math.sin(a2) * ry * (.93 + rnd() * .13);
      g.beginPath();
      g.moveTo(px, py);
      g.lineTo(px + Math.cos(a2) * 9, py + Math.sin(a2) * 9);
      g.stroke();
    }
    const rl = g.createRadialGradient(cx - rx * .52, cy - ry * .70, 6, cx - rx * .34, cy - ry * .48, rx * .92);
    rl.addColorStop(0, 'rgba(255,216,146,.18)');
    rl.addColorStop(1, 'rgba(255,216,146,0)');
    g.fillStyle = rl;
    g.beginPath(); g.ellipse(cx, cy, rx * 1.02, ry * 1.04, 0, 0, TAU); g.fill();
  }
