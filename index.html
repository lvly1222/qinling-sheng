      g.moveTo(cx + half*.16, y - drop*.38);
      g.quadraticCurveTo(cx + half*.64, y - drop*.30, cx + half*.98, y - drop*.11);
      g.strokeStyle = rgba(rim, .26);
      g.lineWidth = Math.max(.5, drop*.042);
      g.stroke();
    }

    // needle sparks along the lower edge, only close enough to read
    if(detail > .62 && half > 9){
      g.strokeStyle = rgba(cd, .40);
      g.lineWidth = Math.max(.4, drop*.03);
      for(let k=0;k<8;k++){
        const t = .10 + rnd()*.80;
        const px = cx - half + 2*half*t;
        const sag = drop*(.42 + .58*Math.sin(t*Math.PI))*(.70 + rnd()*.40);
        g.beginPath();
        g.moveTo(px, y + sag*.58);
        g.lineTo(px + (rnd()-.5)*drop*.5, y + sag + drop*.24);
        g.stroke();
      }
    }
  }

  function drawFir(g, x, y, s, seed, fog, detail, p){
    const rnd = mulberry32(seed);
    const h = s * (1.04 + rnd()*.20);
    const grow = easeOutCubic(clamp((p - .02) / .56, 0, 1));
    const baseW = s * (.31 + rnd()*.05);
    const lean = (rnd()-.5)*s*.05;
    const baseCol = [32, 48, 39];
    groundShadow(g, x + s*.04, y + 2, s*.27, s*.065, .16, detail > .5);

    if(grow < .02) return;

    // only the foot of the trunk shows; the skirts cover the rest
    g.strokeStyle = rgba(fogged([62,56,44], fog), .9);
    g.lineWidth = Math.max(.8, s*.032);
    g.beginPath();
    g.moveTo(x, y + 1);
    g.lineTo(x + lean, y - h*grow*.30);
    g.stroke();

    const canopyP = clamp((p - .12) / .76, 0, 1);
    if(canopyP <= 0) return;
    g.save();
    g.globalAlpha *= canopyP;

    // dark spire body, so overlapping skirts never open into a wireframe
    g.beginPath();
    g.moveTo(x - baseW*grow*.96, y - h*grow*.10);
    g.quadraticCurveTo(x - baseW*grow*.46, y - h*grow*.52, x + lean, y - h*grow*.97);
    g.quadraticCurveTo(x + baseW*grow*.48, y - h*grow*.50, x + baseW*grow*.94, y - h*grow*.08);
    g.closePath();
    g.fillStyle = rgba(fogged(shade(baseCol, .10), fog), .96);
    g.fill();

    const tiers = detail > .55 ? 13 : (detail > .4 ? 8 : 6);
    for(let i=0;i<tiers;i++){
      const t = i/(tiers-1);
      const lp = clamp((p - (.05 + t*.52)) / .40, 0, 1);
      if(lp <= 0) continue;
      const sc = easeOutCubic(lp);
      const yy = y - h*grow*(.13 + t*.76);
      const half = baseW*grow*Math.pow(1-t, .78)*(.93 + (i%2?.10:0))*sc;
      const drop = h*grow*(.072 + (1-t)*.062);
      const col = mix(baseCol, [50, 66, 47], .06 + t*.30);
      coniferTier(g, x + lean*t, yy, half, drop, col, fog, seed + i*29, detail);
    }

    const tipP = clamp((p - .50) / .34, 0, 1);
    if(tipP > 0){
      g.save();
      g.globalAlpha *= tipP;
      coniferTier(g, x + lean, y - h*grow*.92, baseW*grow*.10, h*grow*.10,
        mix(baseCol, [24, 38, 32], .3), fog, seed + 701, detail);
      g.restore();
    }

    // overall volume: cool shadow left, warm light right
    const rimCol = fogged(mix(lighten(baseCol, .45), [230, 224, 184], .55), fog);
    g.save();
    g.beginPath();
    g.moveTo(x - baseW*grow*.94, y - h*grow*.10);
    g.quadraticCurveTo(x - baseW*grow*.44, y - h*grow*.52, x + lean, y - h*grow*.94);
    g.quadraticCurveTo(x + baseW*grow*.46, y - h*grow*.50, x + baseW*grow*.92, y - h*grow*.08);
    g.closePath();
    g.clip();
    const lg = g.createLinearGradient(x - baseW*grow, 0, x + baseW*grow, 0);
    lg.addColorStop(0, 'rgba(16,30,25,.28)');
    lg.addColorStop(.58, 'rgba(20,34,28,0)');
    lg.addColorStop(1, 'rgba(214,210,170,.20)');
    g.fillStyle = lg;
    g.fillRect(x - baseW*grow*1.2, y - h*grow, baseW*grow*2.4, h*grow*1.05);
    g.restore();

    // lit branch shelves on the sun side
    for(let i=0;i<tiers;i++){
      const t = i/(tiers-1);
      const yy = y - h*grow*(.15 + t*.74);
      const half = baseW*grow*Math.pow(1-t, .80)*(.93 + (i%2?.10:0));
      if(half < 4) continue;
      g.beginPath();
      g.moveTo(x + lean*t + half*.08, yy - h*grow*.01);
      g.quadraticCurveTo(x + lean*t + half*.55, yy - h*grow*.035,
        x + lean*t + half*.94, yy + h*grow*.012);
      g.strokeStyle = rgba(rimCol, .13);
      g.lineWidth = Math.max(.45, h*grow*.005);
      g.stroke();
    }

    if(detail > .44){
      g.save();
      g.globalAlpha *= .10 * smoothstep(.45, 1, p);
      softEllipse(g, x + baseW*.46, y - h*grow*.68, baseW*.34, h*grow*.30, [220, 219, 180], .70);
      g.restore();
    }
    g.restore();
  }

  function pineFringe(g, cx, cy, rx, ry, col, fog, seed, detail){
    const rnd = mulberry32(seed + 77);
    const n = detail > .6 ? 62 : 26;
    const cd = fogged(shade(col, .24), fog);
    const cl = fogged(lighten(col, .22), fog);
    /* the fringe is dozens of hairlines: gather them into a few shared
       paths and stroke each path once, rather than one stroke per needle */
    const NE = [cl, cd];
    const NW = [];
    for(let i=0;i<8;i++) NW.push([]);
    for(let k=0;k<n;k++){
      const a = rnd()*TAU;
      const d = .68 + rnd()*.36;
      const px = cx + Math.cos(a)*rx*d;
      const py = cy + Math.sin(a)*ry*d;
      const len = (2.2 + rnd()*5.6)*(detail > .6 ? 1 : .62);
      const al = .28 + rnd()*.20;
      const wd = Math.max(.35, .5 + rnd()*.7);
      const ci = k%3 === 0 ? 0 : 1;
      const wi = wd > .85 ? 1 : 0;
      const ai = al > .38 ? 1 : 0;
      const bin = ci*4 + wi*2 + ai;
      const list = NW[bin]; list.push(px, py,
        px + Math.cos(a)*len*1.2, py + Math.sin(a)*len*.90 + len*.28);
    }
    for(let bin=0;bin<8;bin++){
      const list = NW[bin];
      if(!list.length) continue;
      const ci = bin >> 2, wi = (bin >> 1) & 1, ai = bin & 1;
      g.strokeStyle = rgba(NE[ci], ai ? .46 : .30);
      g.lineWidth = wi ? 1.02 : .52;
      g.beginPath();
      for(let j=0;j<list.length;j+=4){
        g.moveTo(list[j], list[j+1]);
        g.lineTo(list[j+2], list[j+3]);
      }
      g.stroke();
    }
  }

  function pineCluster(g, cx, cy, r, col, fog, seed, detail, sc){
    const rnd = mulberry32(seed);
    const dark = fogged(shade(col, .42), fog);
    const mid = fogged(col, fog);
    const lit = fogged(lighten(col, .20), fog);

    // shaded underside: this is what stops the tuft reading as a flat pad
    blobPath(g, cx - r*.04, cy + r*.22, r*.86*sc, r*.46*sc, seed + 3, 9);
    g.fillStyle = rgba(dark, .96);
    g.fill();

    const n = detail > .6 ? 6 : 4;
    for(let k=0;k<n;k++){
      const a = k * 1.7 + rnd()*.5;
      const rr = .18 + rnd()*.44;
      const bx = cx + Math.cos(a)*r*rr*.92;
      const by = cy + Math.sin(a)*r*.60*rr - r*.10;
      const lightT = clamp(.52 - Math.cos(a)*.30 + Math.sin(a)*.20, 0, 1);
      blobPath(g, bx, by,
        r*(.30 + rnd()*.20)*sc, r*(.20 + rnd()*.15)*sc, seed + 10 + k*7, 8);
      g.fillStyle = rgba(mix(mid, lit, lightT*.78), .94);
      g.fill();
    }

    // warm rim on the upper-right edge
    softEllipse(g, cx + r*.28, cy - r*.30, r*.44, r*.19,
      fogged(mix(lighten(col, .34), [210, 198, 150], .38), fog), .18);

    pineFringe(g, cx, cy, r*.88, r*.58, mix(col, [48, 64, 46], .18), fog, seed, detail);

    // close up, the tuft needs a few true needle strokes to keep its
    // edge soft and airy
    if(detail > .95){
      const nr = mulberry32(seed + 991);
      for(let k=0;k<30;k++){
        const a = nr()*TAU;
        const d = .50 + nr()*.62;
        const sx = cx + Math.cos(a)*r*d;
        const sy = cy + Math.sin(a)*r*.58*d;
        const ln = r*(.24 + nr()*.38);
        const la = a + (nr()-.5)*.6;
        g.strokeStyle = rgba(k%3 ? fogged(shade(col,.18), fog) : fogged(lighten(col,.30), fog), .36);
        g.lineWidth = Math.max(.35, r*.035);
        g.beginPath();
        g.moveTo(sx, sy);
        g.lineTo(sx + Math.cos(la)*ln, sy + Math.sin(la)*ln*.55 - ln*.18);
        g.stroke();
      }
    }

    // snow resting on the upper needles
    if(SEASON === 3 && sc > .04){
      const wr = mulberry32(seed + 1717);
      const wn = detail > .6 ? 6 : 3;
      softEllipse(g, cx, cy + r*.10, r*.46*sc, r*.09*sc, [166,188,210], .12);
      for(let k=0;k<wn;k++){
        const a = -2.75 + wr()*1.9;
        const d = .16 + wr()*.58;
        const px = cx + Math.cos(a)*r*d;
        const py = cy + Math.sin(a)*r*.56*d - r*.10;
        softEllipse(g, px, py,
          r*(.15 + wr()*.15)*sc, r*(.05 + wr()*.045)*sc,
          [244,249,253], .40 + wr()*.32);
      }
    }
  }

  function drawPine(g, x, y, s, seed, fog, detail, p){
    const rnd = mulberry32(seed);
    const h = s * (.98 + rnd()*.16);
    const grow = easeOutCubic(clamp((p - .02) / .54, 0, 1));
    const lean = (rnd()-.5)*s*.14;
    const baseCol = [38, 55, 42];
    groundShadow(g, x + s*.05, y + 2, s*.34, s*.085, .18, detail > .5);
    if(grow <= .01) return;

    const axisX = t => x + lean*easeOutCubic(t);
    const trunkTop = y - h*grow*(.74 + .06*smoothstep(.4, 1, p));
    const tw = Math.max(1.2, s*.052*(.60 + grow*.40));

    // a warm, slightly leaning 华山松 trunk, lit along its right side
    g.strokeStyle = rgba(fogged([90, 72, 51], fog));
    g.lineWidth = tw;
    g.beginPath();
    g.moveTo(x, y + 1);
    g.quadraticCurveTo(axisX(.44), y - (y - trunkTop)*.42, axisX(1), trunkTop);
    g.stroke();
    g.strokeStyle = rgba(fogged([144, 118, 82], fog), .34);
    g.lineWidth = Math.max(.45, tw*.24);
    g.beginPath();
    g.moveTo(x + tw*.26, y + 1);
    g.quadraticCurveTo(axisX(.44) + tw*.22, y - (y - trunkTop)*.42, axisX(1) + tw*.14, trunkTop + h*.03);
    g.stroke();

    // boughs, not pom-poms: long low limbs ending in tufted fans
    const limbs = [
      { t: .82, dir:  .06, len: .11, rise: .14, th: .50, back: true },
      { t: .70, dir: -.08, len: .14, rise: .06, th: .48, back: true },
      { t: .56, dir: -.34, len: .27, rise: .06, th: .36, back: true },
      { t: .60, dir:  .36, len: .30, rise: .04, th: .32, back: true },
      { t: .46, dir: -.42, len: .34, rise: .01, th: .24 },
      { t: .50, dir:  .44, len: .37, rise: .00, th: .20 },
      { t: .34, dir: -.31, len: .28, rise: -.03, th: .15 },
      { t: .37, dir:  .32, len: .30, rise: -.05, th: .11 }
    ];
    // upper boughs first, lower boughs in front
    limbs.sort((a,b) => b.t - a.t);

    for(const b of limbs){
      const bp = clamp((p - b.th) / .32, 0, 1);
      if(bp <= 0) continue;
      const sc = easeOutCubic(bp);
      const ax = axisX(b.t);
      const ay = y - h*grow*b.t;
      const ex = ax + b.dir*s*grow*(.55 + sc*.45);
      const ey = ay - b.rise*s*grow*sc - s*.006;
      const bx = ax + (ex - ax)*.42;
      const by = ay + (ey - ay)*.42 + s*.014;

      g.strokeStyle = rgba(fogged(b.back ? [74, 61, 47] : [86, 71, 52], fog), .88);
      g.lineWidth = Math.max(.55, s*(b.back ? .012 : .016)*(.45 + sc*.55));
      g.beginPath();
      g.moveTo(ax, ay + s*.004);
      g.quadraticCurveTo(bx + (b.dir < 0 ? -s*.02 : s*.02), by, ex, ey);
      g.stroke();

      // a tight fan of needle clusters at the bough end
      const nC = detail > .68 ? 6 : 5;
      for(let k=0;k<nC;k++){
        const t = .58 + (k/(nC-1))*.44;
        const px = ax + (ex - ax)*t + (rnd()-.5)*s*.055;
        const py = ay + (ey - ay)*t - s*.022 - rnd()*s*.042
                 + (k%2 ? s*.014 : 0);
        const r = s*(.074 + rnd()*.028)*(b.back ? .88 : 1);
        const col = mix(baseCol, [46, 64, 46], rnd()*.42 + (b.back ? .10 : 0));
        pineCluster(g, px, py, r, col, fog,
          seed + ((px*7 + py*3)|0),
          clamp(detail * (s/95), .32, detail), sc * (.70 + .30*(k/(nC-1))));
      }
    }

    // soft crown light
    g.save();
    g.globalAlpha *= .12 * smoothstep(.5, 1, p);
    softEllipse(g, axisX(.7) + s*.16, y - h*grow*.70, s*.30, h*grow*.18, [219, 216, 178], .60);
    g.restore();
  }

  function drawSimpleConifer(g, x, y, s, seed, fog, detail, p, kind){
    const rnd = mulberry32(seed);
    const fir = kind === 'fir';
    const h = s * (fir ? 1.02 : .94) * (.92 + rnd()*.18);
    const grow = easeOutCubic(clamp((p - .02) / .52, 0, 1));
    const baseW = s * (fir ? .30 : .42) * (.86 + rnd()*.22);
    const baseCol = fir ? [28, 43, 35] : [33, 49, 38];
    groundShadow(g, x + s*.03, y + 1, s*.26, s*.055, .13, false);
    if(grow < .02) return;

    g.save();
    g.globalAlpha *= clamp((p - .10)/.55, 0, 1);

    if(fir){
      g.beginPath();
      g.moveTo(x - baseW*grow*.94, y - h*grow*.10);
      g.quadraticCurveTo(x - baseW*grow*.42, y - h*grow*.52, x, y - h*grow*.96);
      g.quadraticCurveTo(x + baseW*grow*.44, y - h*grow*.50, x + baseW*grow*.92, y - h*grow*.08);
      g.closePath();
      g.fillStyle = rgba(fogged(shade(baseCol, .08), fog), .96);
      g.fill();

      const tiers = detail > .4 ? 8 : 6;
      for(let i=0;i<tiers;i++){
        const t = i/(tiers-1);
        const yy = y - h*grow*(.14 + t*.74);
        const half = baseW*grow*Math.pow(1-t, .80)*(.92 + (i%2?.12:0));
        const drop = h*grow*(.085 + (1-t)*.055);
        coniferTier(g, x, yy, half, drop, mix(baseCol, [22, 36, 31], t*.28), fog, seed + i*19, detail*.7);
      }
    } else {
      const cx = x + (rnd()-.5)*s*.05;
      const cy = y - h*grow*.64;
      const cw = baseW*grow;
      const ch = h*grow*.44;
      // short visible trunk
      g.strokeStyle = rgba(fogged([72, 62, 48], fog), .9);
      g.lineWidth = Math.max(.7, s*.030);
      g.beginPath();
      g.moveTo(x, y + 1);
      g.lineTo(cx, y - h*grow*.46);
      g.stroke();

      blobPath(g, cx, cy, cw*.56, ch*.52, seed + 3, 9);
      g.fillStyle = rgba(fogged(shade(baseCol, .22), fog), .95);
      g.fill();
      const n = detail > .32 ? 5 : 4;
      for(let i=0;i<n;i++){
        const a = i*2.399963 + rnd()*.5;
        const rr = Math.sqrt((i + .5)/n);
        blobPath(g, cx + Math.cos(a)*cw*.32*rr, cy + Math.sin(a)*ch*.30*rr,
          cw*(.24 + rnd()*.10), ch*(.24 + rnd()*.10), seed + 20 + i*11, 8);
        g.fillStyle = rgba(fogged(mix(baseCol, [40, 56, 40], rnd()*.4), fog), .92);
        g.fill();
      }
      pineFringe(g, cx, cy, cw*.48, ch*.44, baseCol, fog, seed, detail*.8);
    }
    g.restore();
  }

  function drawConifer(g, x, y, s, seed, fog, detail, p, kind){
    if(detail < .52 || s < 30){
      drawSimpleConifer(g, x, y, s, seed, fog, detail, p, kind);
      return;
    }
    if(kind === 'fir') drawFir(g, x, y, s, seed, fog, detail, p);
    else drawPine(g, x, y, s, seed, fog, detail, p);
  }

  function drawBamboo(g, x, y, s, seed, fog, detail, p, dwarf){
    const rnd = mulberry32(seed);
    const grow = easeOutCubic(clamp((p - .02)/.46, 0, 1));
    groundShadow(g, x + s*.04, y+1, s*.32, s*.06, .14, detail > .5);
    const n = dwarf ? 6 : (5 + Math.floor(rnd()*5));

    for(let c=0;c<n;c++){
      const bx = x + (rnd()-.5) * s * (dwarf ? .55 : .72);
      const h = s * (dwarf ? (.38+rnd()*.35) : (.60+rnd()*.55)) * grow;
      const lean = (rnd()-.5) * s * (dwarf ? .18 : .28);
      const lib = clamp((p - (.10 + c*.035)) / .4, 0, 1);
      if(lib <= 0) continue;
      const hh = h * easeOutCubic(lib);
      const col = c % 2 ? [122,132,88] : [104,118,79];

      g.strokeStyle = rgba(fogged(shade(col,.20), fog));
      g.lineWidth = Math.max(.9, s*(dwarf?.020:.024));
      g.beginPath();
      g.moveTo(bx, y+1);
      g.quadraticCurveTo(bx + lean*.3, y - hh*.55, bx + lean, y - hh);
      g.stroke();
      // lit side of the culm
      g.strokeStyle = rgba(fogged(lighten(col,.26), fog), .55);
      g.lineWidth = Math.max(.35, s*.008);
      g.beginPath();
      g.moveTo(bx + s*.008, y+1);
      g.quadraticCurveTo(bx + lean*.3 + s*.010, y - hh*.55, bx + lean + s*.006, y - hh);
      g.stroke();

      // nodes
      g.strokeStyle = rgba(fogged(shade(col,.22), fog), .65);
      g.lineWidth = Math.max(.45, s*.009);
      for(let k=1;k<=3;k++){
        const t = k/4;
        const nx = bx + lean*t*t;
        const ny = y - hh*t;
        g.beginPath();
        g.moveTo(nx - s*.012, ny);
        g.lineTo(nx + s*.012, ny);
        g.stroke();
      }

      // leaf fans near the top (bare culms in winter)
      if(p > .38 && detail > .25 && SEASON !== 3){
        const leafP = clamp((p - .38)/.35, 0, 1);
        const tipX = bx + lean;
        const tipY = y - hh;
        const leaves = dwarf ? 5 : 8;
        for(let k=0;k<leaves;k++){
          const a = -Math.PI*.96 + (k/(leaves-1)) * Math.PI*.80 + (rnd()-.5)*.14;
          const ln = s*(dwarf?.10:.145)*(0.7+rnd()*.4)*leafP;
          leafShape(g, tipX, tipY + s*.02, ln, ln*.22, a, k%2?[136,156,86]:[106,132,72], .90, false);
        }
        // a second, lower fan keeps the culm from ending in a bare brush
        for(let k=0;k<4;k++){
          const a = -Math.PI*.86 + k*.34 + (rnd()-.5)*.2;
          const ln = s*(dwarf?.075:.105)*(0.7+rnd()*.4)*leafP;
          leafShape(g, bx + lean*.78, y - hh*.78, ln, ln*.20, a,
            k%2?[124,146,78]:[96,120,66], .82, false);
        }
      }
    }
  }

  function drawRhodo(g, x, y, s, seed, fog, detail, p){
    const rnd = mulberry32(seed);
    const grow = easeOutCubic(clamp((p - .02)/.44, 0, 1));
    const R = s * .54 * grow;
    groundShadow(g, x + s*.03, y+1, s*.38, s*.08, .16, detail > .5);
    if(R < 1) return;

    // leaf mound
    const n = detail > .5 ? 11 : 7;
    for(let i=0;i<n;i++){
      const a = (i/n)*TAU + rnd()*.2;
      const d = .25 + rnd()*.65;
      const lx = x + Math.cos(a)*R*d;
      const ly = y - R*.22 + Math.sin(a)*R*.16*d;
      g.save();
      g.translate(lx, ly);
      g.rotate(a + Math.PI*.5);
      g.beginPath();
      g.ellipse(0, 0, R*.34, R*.10, 0, 0, TAU);
      g.fillStyle = rgba(fogged(i%3 ? [48,64,46] : [60,76,52], fog));
      g.fill();
      g.restore();
    }

    // flowers
    const fP = SEASON === 3 ? 0 : clamp((p - .52)/.42, 0, 1);
    if(fP > 0 && detail > .3){
      const groups = 3;
      for(let gi=0; gi<groups; gi++){
        const gx = x + (rnd()-.5)*R*1.15;
        const gy = y - R*.52 - rnd()*R*.24;
        const cr = R*(.15 + rnd()*.06) * fP;
        for(let k=0;k<5;k++){
          const a = (k/5)*TAU + gi;
          const px = gx + Math.cos(a)*cr*.62;
          const py = gy + Math.sin(a)*cr*.38;
          g.beginPath();
          g.arc(px, py, cr*.30, 0, TAU);
          g.fillStyle = rgba(fogged(k%2?[191,167,164]:[206,186,183], fog), .92);
          g.fill();
          g.beginPath();
          g.arc(px - cr*.05, py - cr*.04, cr*.10, 0, TAU);
          g.fillStyle = rgba(fogged([229,208,196], fog), .9);
          g.fill();
        }
        g.beginPath();
        g.arc(gx, gy, cr*.16, 0, TAU);
        g.fillStyle = rgba(fogged([151,131,91], fog), .85);
        g.fill();
      }
    }
  }

  function drawWillow(g, x, y, s, seed, fog, detail, p, twisted){
    const rnd = mulberry32(seed);
    const h = s * (twisted ? .72 : .86) * (.9+rnd()*.2);
    const grow = easeOutCubic(clamp((p - .02)/.5, 0, 1));
    groundShadow(g, x + s*.04, y+1, s*.30, s*.065, .15, detail > .5);
    if(grow < .02) return;

    const lean = (rnd()-.5)*s*.18;
    g.strokeStyle = rgba(fogged([87,79,62], fog));
    g.lineWidth = Math.max(1, s*.055*(.55+grow*.5));
    g.beginPath();
    g.moveTo(x, y+1);
    g.bezierCurveTo(x - lean*.4, y - h*.3*grow, x + lean*1.2, y - h*.55*grow, x + lean, y - h*.72*grow);
    g.stroke();

    // angular branches
    const branchP = clamp((p - .20)/.45, 0, 1);
    if(branchP <= 0) return;
    const tips = [];
    const bn = twisted ? 4 : 5;
    for(let i=0;i<bn;i++){
      const dir = i%2 ? 1 : -1;
      const bx = x + lean*.7;
      const by = y - h*grow*(.50 + i*.055);
      const tx = bx + dir*s*(.18 + rnd()*.20);
      const ty = by - s*(.10 + rnd()*.18);
      g.strokeStyle = rgba(fogged([92,83,66], fog), .92);
      g.lineWidth = Math.max(.6, s*.018);
      g.beginPath();
      g.moveTo(bx, by);
      g.quadraticCurveTo(bx + dir*s*.09, by - s*.04, tx, ty);
      g.stroke();
      tips.push([tx, ty, .9 + rnd()*.8]);
    }

    const leafP = clamp((p - .30)/.5, 0, 1);
    if(leafP <= 0) return;
    tips.forEach((tp, i) => {
      const sc = easeOutCubic(leafP);
      drawCluster(g, tp[0], tp[1], s*.12*tp[2]*sc, s*.085*tp[2]*sc, seed+400+i*19, [111,123,95], fog, detail, .9);
    });
  }

  function drawFern(g, x, y, s, seed, fog, detail, p){
    if(SEASON === 3){
      // ferns die back in winter; only a few dry stubs remain
      const wr = mulberry32(seed + 61);
      groundShadow(g, x, y + 1, s*.30, s*.05, detail > .8 ? .16 : .11, detail > .5);
      for(let k=0;k<3;k++){
        const sx = x + (wr() - .5)*s*.5;
        const h = s*(.10 + wr()*.18);
        g.strokeStyle = rgba(fogged([126,120,98], fog), .28 + wr()*.18);
        g.lineWidth = Math.max(.5, s*.010);
        g.beginPath();
        g.moveTo(sx, y);
        g.quadraticCurveTo(sx + (wr()-.5)*s*.10, y - h*.6,
          sx + (wr()-.5)*s*.18, y - h);
        g.stroke();
      }
      return;
    }
    const rnd = mulberry32(seed);
    const grow = easeOutCubic(clamp((p - .02)/.5, 0, 1));
    groundShadow(g, x, y+1, s*.33, s*.058, detail > .8 ? .24 : .17, detail > .5);
    if(grow < .02) return;

    // fiddleheads: the coiled young fronds are what make a fern read as
    // a fern rather than a bundle of feathers
    if(detail > .48 && p > .28){
      const fp = smoothstep(.28, .62, p);
      for(let k=0;k<2;k++){
        const fx = x + (k ? 1 : -1)*s*(.10 + rnd()*.14);
        const fy = y - s*.10 - rnd()*s*.08;
        const rr = s*(.052 + rnd()*.028)*fp;
        const a0 = -1.6 + k*.5;
        g.strokeStyle = rgba(fogged([104,128,72], fog), .88);
        g.lineWidth = Math.max(.55, s*.013);
        g.beginPath();
        g.arc(fx, fy, rr, a0, a0 + 4.3);
        g.stroke();
        g.fillStyle = rgba(fogged([132,154,92], fog), .55);
        g.beginPath();
        g.arc(fx + Math.cos(a0+4.3)*rr, fy + Math.sin(a0+4.3)*rr, Math.max(.5, rr*.30), 0, TAU);
        g.fill();
      }
    }

    const n = detail > .55 ? 10 : 7;
    const fronds = [];
    for(let i=0;i<n;i++){
      const a = -Math.PI*.92 + (i/(n-1))*Math.PI*.84 + (rnd()-.5)*.07;
      const len = s*(.64 + rnd()*.40)*grow;
      fronds.push({a, len, back: rnd() < .42, ph: rnd()});
    }
    // the back fronds go down first, hazed and cool; the front ones are
    // brighter and sit over them, so the rosette has depth
    fronds.sort((a,b)=> (b.back ? 1 : 0) - (a.back ? 1 : 0));

    for(const f of fronds){
      const back = f.back;
      const tipX = x + Math.cos(f.a)*f.len*.94;
      const tipY = y + Math.sin(f.a)*f.len + f.len*.10;
      const ctrlX = x + Math.cos(f.a)*f.len*.50;
      const ctrlY = y + Math.sin(f.a)*f.len*.52 - f.len*.10;
      const base = back ? [62, 86, 52] : [78, 106, 58];
      const col = back ? fogged(shade(base, .12), fog) : fogged(base, fog*.8);

      // rachis, darker than the pinnae
      g.strokeStyle = rgba(fogged(shade(base, .38), fog), .94);
      g.lineWidth = Math.max(.55, s*.011);
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(ctrlX, ctrlY, tipX, tipY);
      g.stroke();

      if(detail > .40){
        const steps = detail > .65 ? 9 : 6;
        for(let k=1;k<=steps;k++){
          const t = k/(steps+1);
          const mt = 1-t;
          const px = mt*mt*x + 2*mt*t*ctrlX + t*t*tipX;
          const py = mt*mt*y + 2*mt*t*ctrlY + t*t*tipY;
          const dx = 2*mt*(ctrlX-x) + 2*t*(tipX-ctrlX);
          const dy = 2*mt*(ctrlY-y) + 2*t*(tipY-ctrlY);
          const ang = Math.atan2(dy, dx);
          const w = f.len*(.150*(1-t) + .028);
          const lit = back ? shade(col, .08) : lighten(col, k%3===0 ? .10 : .02);
          // near pinna (lower) longer than the far one
          leafShape(g, px, py, w*1.02, w*.26, ang + 1.02, lit, .94, false);
          leafShape(g, px, py, w*.84, w*.23, ang - 1.04, shade(col, back ? .20 : .12), .90, false);
          // a wet, glossy edge on the near pinna
          if(!back && detail > .6 && k%2 === 0){
            g.strokeStyle = rgba(lighten(col, .30), .22);
            g.lineWidth = Math.max(.35, s*.006);
            g.beginPath();
            g.moveTo(px + Math.cos(ang+1.02)*w*.30, py + Math.sin(ang+1.02)*w*.30 - w*.10);
            g.lineTo(px + Math.cos(ang+1.02)*w*.86, py + Math.sin(ang+1.02)*w*.86 - w*.15);
            g.stroke();
          }
        }
      }
    }
  }

  function drawGrass(g, x, y, s, seed, fog, detail, p){
    const rnd = mulberry32(seed);
    const grow = easeOutCubic(clamp((p - .02)/.48, 0, 1));
    groundShadow(g, x + s*.04, y+1, s*.26, s*.045, detail > .8 ? .20 : .12, detail > .5);
    if(grow < .01) return;
    const n = detail > .55 ? 13 : 7;
    const blades = [];
    for(let i=0;i<n;i++){
      const bx = x + (rnd()-.5)*s*.56;
      const h = s*(.36 + rnd()*.62);
      const bend = (rnd()-.5)*s*(.55 + rnd()*.5);
      blades.push({bx, h, bend, tone: rnd()});
    }
    blades.sort((a,b)=>a.h-b.h);
    blades.forEach((b, i) => {
      const lib = clamp((p - (.03 + i*.018))/(.5), 0, 1);
      if(lib <= 0) return;
      const hh = b.h * easeOutCubic(lib) * grow;
      const tipX = b.bx + b.bend*easeOutCubic(lib);
      const tipY = y - hh;
      const dry = b.tone > .93;
      const dark = dry ? [134,120,74] : (b.tone > .5 ? [70,90,53] : [82,102,61]);
      const light = dry ? [188,170,110] : (b.tone > .5 ? [150,168,98] : [132,152,92]);
      g.strokeStyle = rgba(fogged(dark, fog), .94);
      g.lineWidth = Math.max(.75, s*(.020 + b.tone*.012));
      g.beginPath();
      g.moveTo(b.bx, y+1);
      g.quadraticCurveTo(b.bx + b.bend*.32, y - hh*.58, tipX, tipY);
      g.stroke();

      // the blade catches light along its right side and at the tip
      if(detail > .40){
        g.strokeStyle = rgba(fogged(light, fog), .46);
        g.lineWidth = Math.max(.38, s*.0075);
        g.beginPath();
        g.moveTo(b.bx + s*.010, y);
        g.quadraticCurveTo(b.bx + b.bend*.32 + s*.012, y - hh*.58, tipX + s*.010, tipY + s*.004);
        g.stroke();
      }

      // seed head
      if(detail > .6 && b.tone > .82 && p > .6){
        g.save();
        g.translate(tipX, tipY);
        g.rotate(b.bend*.006);
        g.fillStyle = rgba(fogged([158,146,102], fog), .78);
        g.beginPath();
        g.ellipse(0, -s*.035, s*.018, s*.045, .16, 0, TAU);
        g.fill();
        g.restore();
      }
    });
  }

  const FLOWER_PALS = [
    { petal:[242,233,199], inner:[252,246,224], center:[203,156,55], anther:[246,214,120] },
    { petal:[247,244,235], inner:[255,253,247], center:[184,153,78], anther:[240,218,150] },
    { petal:[228,158,167], inner:[247,199,204], center:[176,122,88], anther:[242,206,148] },
    { petal:[148,181,224], inner:[197,217,243], center:[118,143,102], anther:[232,226,182] },
    { petal:[226,196,80], inner:[247,225,142], center:[152,108,42], anther:[250,226,144] }
  ];

  function drawFlower(g, x, y, s, seed, fog, detail, p, alt){
    const rnd = mulberry32(seed);
    const h = s * (.66 + rnd()*.26);
    const grow = easeOutCubic(clamp((p - .02)/.48, 0, 1));
    groundShadow(g, x + s*.02, y+1, s*.20, s*.038, detail > .8 ? .18 : .12, detail > .5);
    if(grow < .01) return;

    const stemX = x + (rnd()-.5)*s*.05;
    const headX = stemX + (rnd()-.5)*s*.07;
    const headY = y - h*grow;

    g.strokeStyle = rgba(fogged([86,105,62], fog), .95);
    g.lineWidth = Math.max(.7, s*.018);
    g.beginPath();
    g.moveTo(x, y+1);
    g.quadraticCurveTo(x + (rnd()-.5)*s*.03, y - h*.45*grow, headX, headY);
    g.stroke();

    // leaves
    if(p > .25){
      const lp = smoothstep(.25, .65, p);
      leafShape(g, x - s*.02, y - h*.30*grow, s*.22*lp, s*.065*lp, -2.55, [91,108,65], .9, false);
      leafShape(g, x + s*.01, y - h*.45*grow, s*.19*lp, s*.055*lp, -0.52, [104,119,74], .9, false);
    }

    const fp = clamp((p - .52)/.44, 0, 1);
    if(fp <= 0) return;
    const R = s*(.135 + rnd()*.035) * easeOutCubic(fp);
    if(R < .5) return;

    let palIdx;
    if(alt > 3300) palIdx = seed % 3 === 0 ? 4 : (seed % 2 ? 3 : 1);
    else if(alt > 3000) palIdx = seed % 3 === 0 ? 2 : (seed % 2 ? 4 : 1);
    else palIdx = seed % 4 === 0 ? 2 : 0;
    const pal = FLOWER_PALS[palIdx];
    const petals = seed % 3 === 0 ? 5 : (seed % 3 === 1 ? 8 : 12);
    const petalW = petals <= 5 ? .40 : (petals <= 8 ? .24 : .150);

    // soft under-shadow
    g.save();
    g.globalAlpha *= .35;
    g.fillStyle = rgba(fogged(shade(pal.center,.15), fog));
    g.beginPath();
    g.arc(headX + R*.10, headY + R*.14, R*.52, 0, TAU);
    g.fill();
    g.restore();

    for(let k=0;k<petals;k++){
      const a = k/petals*TAU + (seed % 7)*.13;
      const lit = (k % 3 === 0);
      g.save();
      g.translate(headX, headY);
      g.rotate(a);
      // the petal lifts off the ones beneath it, casting a small shadow
      g.beginPath();
      g.moveTo(R*.08, R*.055);
      g.quadraticCurveTo(R*.34, -R*petalW + R*.055, R*.98, -R*petalW*.34 + R*.055);
      g.quadraticCurveTo(R*1.03, R*.055, R*.98, R*petalW*.34 + R*.055);
      g.quadraticCurveTo(R*.34, R*petalW + R*.055, R*.08, R*.055);
      g.closePath();
      g.fillStyle = rgba(fogged(shade(pal.petal, .50), fog), .34);
      g.fill();
      g.beginPath();
      g.moveTo(R*.08, 0);
      g.quadraticCurveTo(R*.34, -R*petalW, R*.98, -R*petalW*.34);
      g.quadraticCurveTo(R*1.03, 0, R*.98, R*petalW*.34);
      g.quadraticCurveTo(R*.34, R*petalW, R*.08, 0);
      g.closePath();
      g.fillStyle = rgba(fogged(lit ? lighten(pal.petal,.10) : pal.petal, fog), .96);
      g.fill();
      // rim light along the upper edge of the petal
      if(k % 2 === 0){
        g.strokeStyle = rgba(lighten(pal.petal, .34), .62);
        g.lineWidth = Math.max(.4, R*.013);
        g.beginPath();
        g.moveTo(R*.58, -R*petalW*.66);
        g.quadraticCurveTo(R*.90, -R*petalW*.40, R*.97, -R*petalW*.12);
        g.stroke();
      }
      // inner relief
      g.beginPath();
      g.moveTo(R*.22, 0);
      g.quadraticCurveTo(R*.48, -R*petalW*.58, R*.82, -R*petalW*.12);
      g.quadraticCurveTo(R*.48, R*petalW*.46, R*.22, 0);
      g.fillStyle = rgba(fogged(pal.inner, fog), .50);
      g.fill();
      g.restore();
    }

    // center
    g.beginPath();
    g.arc(headX, headY, R*.30, 0, TAU);
    g.fillStyle = rgba(fogged(pal.center, fog), .94);
    g.fill();
    g.beginPath();
    g.arc(headX - R*.03, headY - R*.04, R*.19, 0, TAU);
    g.fillStyle = rgba(fogged(lighten(pal.center,.18), fog), .92);
    g.fill();
    g.beginPath();
    g.arc(headX - R*.07, headY - R*.09, Math.max(.5, R*.055), 0, TAU);
    g.fillStyle = rgba(lighten(pal.anther, .35), .60);
    g.fill();

    // anthers
    const an = detail > .55 ? 8 : 4;
    g.fillStyle = rgba(fogged(pal.anther, fog), .9);
    for(let k=0;k<an;k++){
      const a = k/an*TAU + seed*.07;
      const rr = R*(.12 + (k%2)*.08);
      g.beginPath();
      g.arc(headX + Math.cos(a)*rr, headY + Math.sin(a)*rr*.8, Math.max(.5, R*.045), 0, TAU);
      g.fill();
    }
  }

  function drawCushion(g, x, y, s, seed, fog, detail, p){
    const rnd = mulberry32(seed);
    const grow = easeOutCubic(clamp((p - .02)/.46, 0, 1));
    const R = s*.52*grow;
    groundShadow(g, x, y+1, s*.34, s*.05, .12, detail > .5);
    if(R < .8) return;
    const n = detail > .5 ? 18 : 10;
    const blobs = [];
    for(let i=0;i<n;i++){
      const a = rnd()*TAU, d = Math.pow(rnd(),.55);
      blobs.push({
        x: x + Math.cos(a)*R*d,
        y: y - R*.22 + Math.sin(a)*R*.20*d,
        r: R*(.12 + rnd()*.12)
      });
    }
    blobs.sort((a,b)=>a.y-b.y);
    blobs.forEach((b,i)=>{
      blobPath(g, b.x, b.y, b.r, b.r*.66, seed+i*7, 6);
      g.fillStyle = rgba(fogged(i%4 ? [92,110,74] : [112,126,86], fog), .92);
      g.fill();
      if(detail > .55){
        blobPath(g, b.x + b.r*.18, b.y - b.r*.18, b.r*.48, b.r*.30, seed+i*7+3, 5);
        g.fillStyle = rgba(fogged([148,154,112], fog), .55);
        g.fill();
      }
    });
    // tiny pale flowers
    if(p > .7 && detail > .45){
      const fa = smoothstep(.7,1,p);
      for(let k=0;k<4;k++){
        const a = rnd()*TAU, d = .2+rnd()*.6;
        g.beginPath();
        g.arc(x + Math.cos(a)*R*d, y - R*.25 + Math.sin(a)*R*.14*d, Math.max(.4,R*.045), 0, TAU);
        g.fillStyle = rgba(fogged([221,216,190], fog), .72*fa);
        g.fill();
      }
    }
  }

  function drawLichen(g, x, y, s, seed, fog, detail, p){
    const rnd = mulberry32(seed);
    const grow = easeOutCubic(clamp((p - .02)/.4, 0, 1));
    if(grow < .05) return;
    g.save();
    g.globalAlpha *= .9;
    blobPath(g, x, y + s*.02, s*.46*grow, s*.11*grow, seed, 9);
    g.fillStyle = rgba(fogged([151,157,132], fog), .72);
    g.fill();
    for(let i=0;i<5;i++){
      g.beginPath();
      g.arc(x + (rnd()-.5)*s*.7*grow, y + (rnd()-.3)*s*.12*grow, Math.max(.5,s*.035), 0, TAU);
      g.fillStyle = rgba(fogged(i%2?[176,176,142]:[126,138,108], fog), .6);
      g.fill();
    }
    g.restore();
  }

  /* --- moss, mushrooms and mossy stone --- */
  function mossTuft(g, x, y, s, seed, fog, tint){
    const rnd = mulberry32(seed);
    const col = tint || [96, 126, 63];
    const n = 7 + Math.floor(rnd()*5);
    for(let i=0;i<n;i++){
      const a = rnd()*TAU, d = Math.sqrt(rnd())*s*.55;
      const bx = x + Math.cos(a)*d;
      const by = y + Math.sin(a)*d*.32;
      const r = s*(.10 + rnd()*.13);
      g.beginPath();
      g.ellipse(bx, by + r*.36, r*1.02, r*.40, 0, 0, TAU);
      g.fillStyle = rgba(fogged(shade(col,.58), fog), .34);
      g.fill();
      g.beginPath();
      g.arc(bx, by, r, Math.PI, TAU);
      g.closePath();
      g.fillStyle = rgba(fogged(mix(col, [126,154,76], rnd()*.55), fog), .94);
      g.fill();
      g.beginPath();
      g.ellipse(bx - r*.06, by - r*.30, r*.60, r*.29, -.2, 0, TAU);
      g.fillStyle = rgba(fogged(lighten(col,.36), fog), .44);
      g.fill();
    }
    if(rnd() < .72){
      for(let k=0;k<2;k++){
        const sx = x + (rnd()-.5)*s*.9;
        const sy = y - s*.10;
        const hh = s*(.22 + rnd()*.26);
        g.strokeStyle = rgba(fogged([122,134,84], fog), .58);
        g.lineWidth = Math.max(.35, s*.014);
        g.beginPath();
        g.moveTo(sx, sy);
        g.lineTo(sx + hh*.10, sy - hh);
        g.stroke();
        g.fillStyle = rgba(fogged([148,142,94], fog), .64);
        g.beginPath();
        g.ellipse(sx + hh*.10, sy - hh, Math.max(.4, s*.022), Math.max(.5, s*.042), .2, 0, TAU);
        g.fill();
      }
    }
  }

  function drawMossMat(g, x, y, rx, ry, seed, fog, detail){
    const rnd = mulberry32(seed);
    blobPath(g, x, y, rx, ry, seed, 10);
    g.fillStyle = rgba(fogged([70, 94, 56], fog), .74);
    g.fill();
    const n = detail > .6 ? 13 : 8;
    for(let i=0;i<n;i++){
      const a = rnd()*TAU, d = Math.sqrt(rnd());
      const bx = x + Math.cos(a)*rx*.80*d;
      const by = y + Math.sin(a)*ry*.68*d - ry*.10;
      const r = rx*(.11 + rnd()*.10);
      g.beginPath();
      g.ellipse(bx, by + r*.50, r*1.18, r*.50, 0, 0, TAU);
      g.fillStyle = rgba(fogged(shade([70,94,56],.34), fog), .32);
      g.fill();
      g.beginPath();
      g.arc(bx, by, r, Math.PI, TAU);
      g.closePath();
      g.fillStyle = rgba(fogged(rnd() < .5 ? [92,124,62] : [110,140,72], fog), .95);
      g.fill();
      g.beginPath();
      g.ellipse(bx - r*.05, by - r*.34, r*.56, r*.27, -.18, 0, TAU);
      g.fillStyle = rgba(fogged([168,190,122], fog), .36);
      g.fill();
    }
    for(let k=0;k<3;k++){
      const sx = x + (rnd()-.5)*rx*1.2;
      const sy = y - ry*.16;
      const hh = 3.5 + rnd()*7;
      g.strokeStyle = rgba(fogged([124,142,86], fog), .55);
      g.lineWidth = .65;
      g.beginPath();
      g.moveTo(sx, sy);
      g.lineTo(sx + hh*.15, sy - hh);
      g.stroke();
      g.fillStyle = rgba(fogged([180,182,132], fog), .52);
      g.beginPath();
      g.arc(sx + hh*.15, sy - hh, .8, 0, TAU);
      g.fill();
    }
  }

  function drawShroom(g, x, y, s, seed, fog){
    const rnd = mulberry32(seed);
    const n = 1 + (rnd()*2|0);
    for(let i=0;i<n;i++){
      const sx = x + (rnd()-.5)*s*1.2;
      const hh = s*(.50 + rnd()*.70);
      const capR = s*(.16 + rnd()*.10);
      g.strokeStyle = rgba(fogged([216,208,186], fog), .84);
      g.lineWidth = Math.max(.45, s*.045);
      g.beginPath();
      g.moveTo(sx, y);
      g.quadraticCurveTo(sx + capR*.30, y - hh*.60, sx + capR*.15, y - hh);
      g.stroke();
      g.fillStyle = rgba(fogged([140,130,112], fog), .50);
      g.beginPath();
      g.ellipse(sx + capR*.15, y - hh, capR, capR*.26, 0, 0, TAU);
      g.fill();
      g.beginPath();
      g.ellipse(sx + capR*.15, y - hh - capR*.10, capR, capR*.62, 0, Math.PI, TAU);
      g.closePath();
      g.fillStyle = rgba(fogged([238,232,210], fog), .96);
      g.fill();
      g.beginPath();
      g.ellipse(sx + capR*.02, y - hh - capR*.34, capR*.40, capR*.16, -.3, 0, TAU);
      g.fillStyle = rgba(fogged([255,252,238], fog), .52);
      g.fill();
    }
  }

  function drawMossRock(g, x, y, s, seed, fog){
    const rnd = mulberry32(seed);
    softEllipse(g, x, y + 2, s*.82, s*.15, [30,42,34], .28);

    // stone body, with a lit crown and a shaded foot
    blobPath(g, x, y - s*.30, s*.68, s*.42, seed, 10);
    g.fillStyle = rgba(fogged([118,118,105], fog));
    g.fill();
    g.save();
    blobPath(g, x, y - s*.30, s*.68, s*.42, seed, 10);
    g.clip();
    softEllipse(g, x - s*.26, y - s*.10, s*.60, s*.36, [48,56,49], .46);
    softEllipse(g, x + s*.24, y - s*.54, s*.50, s*.28, [202,196,172], .34);
    for(let k=0;k<3;k++){
      g.strokeStyle = rgba([62,66,58], .22);
      g.lineWidth = Math.max(.6, s*.012);
      g.beginPath();
      g.moveTo(x - s*.34 + k*s*.20, y - s*.58);
      g.quadraticCurveTo(x - s*.26 + k*s*.22, y - s*.34,
        x - s*.30 + k*s*.24, y - s*.10);
      g.stroke();
    }
    g.restore();

    // moss on the upper surfaces, and a little spilling down the front
    mossTuft(g, x - s*.17, y - s*.55, s*.25, seed + 7, fog);
    mossTuft(g, x + s*.19, y - s*.50, s*.21, seed + 13, fog);
    mossTuft(g, x - s*.02, y - s*.17, s*.15, seed + 21, fog);

    // ferns and mushrooms at the foot
    drawFern(g, x - s*.48, y - s*.01, s*.40, seed + 31, fog, .78, 1);
    drawFern(g, x + s*.42, y + 1, s*.33, seed + 37, fog, .70, 1);
    if(s > 60){
      drawShroom(g, x + s*.17, y + 1, s*.11, seed + 41, fog);
      drawShroom(g, x - s*.28, y + 2, s*.09, seed + 43, fog);
    }
    // a pebble or two at the base
    for(let k=0;k<2;k++){
      rockPoly(g, x + (rnd()-.5)*s*1.1, y + 1 + rnd()*3, 2 + rnd()*3,
        (rnd()*99999)|0, [124,126,110], .07);
    }
  }

  function drawPlantByType(g, type, x, y, s, seed, fog, detail, p, alt){
    switch(type){
      case 'oak': drawBroadleaf(g, x, y, s, seed, fog, detail, p, 0); break;
      case 'maple': drawBroadleaf(g, x, y, s, seed, fog, detail, p, 1); break;
      case 'birch': drawBirch(g, x, y, s, seed, fog, detail, p); break;
      case 'pine': drawConifer(g, x, y, s, seed, fog, detail, p, 'pine'); break;
      case 'fir': drawConifer(g, x, y, s, seed, fog, detail, p, 'fir'); break;
      case 'bamboo': drawBamboo(g, x, y, s, seed, fog, detail, p, false); break;
      case 'dwarfBamboo': drawBamboo(g, x, y, s, seed, fog, detail, p, true); break;
      case 'rhodo': drawRhodo(g, x, y, s, seed, fog, detail, p); break;
      case 'willow': drawWillow(g, x, y, s, seed, fog, detail, p, false); break;
      case 'twisted': drawWillow(g, x, y, s, seed, fog, detail, p, true); break;
      case 'fern': drawFern(g, x, y, s, seed, fog, detail, p); break;
      case 'grass': drawGrass(g, x, y, s, seed, fog, detail, p); break;
      case 'flower':
        if(SEASON === 3) drawGrass(g, x, y, s*.92, seed, fog, detail, p);
        else drawFlower(g, x, y, s, seed, fog, detail, p, alt);
        break;
      case 'cushion': drawCushion(g, x, y, s, seed, fog, detail, p); break;
      case 'lichen': drawLichen(g, x, y, s, seed, fog, detail, p); break;
      default: break;
    }
  }

  /* ------------------------------------------------------------
     Static vegetation on the massif
  ------------------------------------------------------------ */
  function backgroundTypeFor(alt, rnd){
    if(alt >= 3340){
      const r = rnd();
      if(r < .34) return 'cushion';
      if(r < .62) return 'grass';
      if(r < .84) return 'lichen';
      return rnd() < .5 ? 'cushion' : 'grass';
    }
    if(alt >= 3000){
      const r = rnd();
      if(r < .28) return 'rhodo';
      if(r < .46) return 'willow';
      if(r < .63) return 'dwarfBamboo';
      if(r < .76) return 'twisted';
      if(r < .90) return 'grass';
      return 'flower';
    }
    if(alt >= 2200){
      const r = rnd();
      if(r < .37) return 'pine';
      if(r < .69) return 'fir';
      if(r < .74) return 'birch';
      if(r < .91) return 'grass';
      return 'flower';
    }
    if(alt >= 1700){
      const r = rnd();
      if(r < .28) return 'oak';
      if(r < .45) return 'birch';
      if(r < .61) return 'pine';
      if(r < .70) return 'fir';
      if(r < .86) return 'grass';
      return 'flower';
    }
    const r = rnd();
    if(r < .25) return 'oak';
    if(r < .37) return 'maple';
    if(r < .47) return 'bamboo';
    if(r < .58) return 'fern';
    if(r < .87) return 'grass';
    return 'flower';
  }

  function forestChance(alt){
    if(alt >= 3340) return .16;
    if(alt >= 3000) return .24;
    if(alt >= 2200) return .48;
    if(alt >= 1700) return .54;
    return .44;
  }

  function clumpDominant(alt, rnd){
    if(alt >= 3180) return rnd() < .55 ? 'rhodo' : (rnd() < .6 ? 'willow' : 'twisted');
    if(alt >= 3000) return rnd() < .45 ? 'rhodo' : (rnd() < .55 ? 'dwarfBamboo' : 'willow');
    if(alt >= 2200) return rnd() < .56 ? 'pine' : 'fir';
    if(alt >= 1700){
      const r = rnd();
      if(r < .44) return 'oak';
      if(r < .66) return 'birch';
      if(r < .82) return 'pine';
      return 'fir';
    }
    const r = rnd();
    if(r < .52) return 'oak';
    if(r < .78) return 'maple';
    return 'bamboo';
  }

  function drawStaticVegetation(g){
    const rnd = mulberry32(0x51a7f00d);
    const items = [];
    const clumps = [];

    function addClump(x, y, alt, depth, cw, ch, dominant, fog, detail){
      // distant clumps are carried mostly by their canopy mass, so only a
      // few silhouettes are needed to give the edge its texture
      const n = detail < .5
        ? (rnd() < .45 ? 1 : 0)
        : 2 + Math.floor(rnd() * (1.2 + depth*4.6));
      for(let j=0;j<n;j++){
        const px = clamp(x + (rnd()-.5)*cw, 4, W-4);
        const py = y + (rnd()-.5)*ch;
        const ry = ridgeY(px);
        if(py < ry + 8) continue;
        if(py > meadowTopY(px) - 4) continue;
        if(inClearing(px, py, -4)) continue;
        const alt2 = altitudeAt(px, py);
        if(alt2 < 830) continue;
        let type = dominant;
        if(rnd() < .30) type = backgroundTypeFor(alt2, rnd);
        if(alt2 > 3300 && type !== 'rhodo' && type !== 'willow' &&
           type !== 'twisted' && type !== 'dwarfBamboo' && type !== 'cushion') {
          type = rnd() < .5 ? 'rhodo' : 'willow';
        }
        if(alt2 < 3200 && rnd() < .16){
          type = rnd() < .58 ? 'grass' : 'fern';
        }
        const base = TYPE_INFO[type] ? TYPE_INFO[type].base : 24;
        const persp = .34 + depth*1.22;
        let size = base * persp * (.70 + rnd()*.56);
        if(alt2 > 3000) size *= .80;
        if(alt2 > 3180) size *= .68;
        const f = clamp(fog*.74 + (1-depth)*.06 + rnd()*.03, 0, .40);
        items.push({
          x: px, y: py, size, seed: (rnd()*2147483647)|0,
          type, alt: alt2, fog: f, detail
        });
      }
      clumps.push({ x, y, cw, ch, dominant, fog, detail });
    }

    // forest clumps on the main slope
    for(let i=0;i<156;i++){
      const x = 16 + rnd()*(W-32);
      const ry = ridgeY(x);
      const maxY = meadowTopY(x) - 14;
      if(maxY <= ry + 26) continue;
      const y = ry + 16 + Math.pow(rnd(), .90) * (maxY - ry - 18);
      const alt = altitudeAt(x, y);
      if(alt < 830 || alt > 3310) continue;
      if(inClearing(x, y, 18)) continue;
      if(alt > 3180 && rnd() < .48) continue;
      const depth = clamp((y - ry)/(H - ry), 0, 1);
      const dominant = clumpDominant(alt, rnd);
      const cw = (74 + rnd()*140) * (.68 + depth*.58);
      const ch = (24 + rnd()*38) * (.70 + depth*.45);
      const fog = clamp(.02 + (1-depth)*.24 + (alt>2800 ? .03 : 0), 0, .34);
      const detail = depth > .64 ? .80 : (depth > .40 ? .52 : .32);
      addClump(x, y, alt, depth, cw, ch, dominant, fog, detail);
    }

    // denser band along the meadow edge
    for(let i=0;i<28;i++){
      const x = rnd()*W;
      const y = meadowTopY(x) - 14 - rnd()*72;
      const ry = ridgeY(x);
      if(y < ry + 30) continue;
      const alt = altitudeAt(x, y);
      if(alt < 900 || alt > 2700) continue;
      if(inClearing(x, y, -10)) continue;
      const depth = clamp((y - ry)/(H - ry), 0, 1);
      const cw = (110 + rnd()*150) * (.8 + depth*.3);
      const ch = (28 + rnd()*34);
      const fog = clamp(.02 + (1-depth)*.19, 0, .27);
      addClump(x, y, alt, depth, cw, ch, clumpDominant(alt, rnd), fog, .82);
    }

    // scattered alpine mats and cushions above the tree line
    for(let i=0;i<520;i++){
      const x = rnd()*W;
      const ry = ridgeY(x);
      const y = ry + 5 + Math.pow(rnd(), .82) * 96;
      const alt = altitudeAt(x, y);
      if(alt < 3320) continue;
      const depth = clamp((y - ry)/(H - ry), 0, 1);
      const r = rnd();
      const flowerCut = SEASON === 0 ? .80 : (SEASON === 2 ? .96 : .90);
      const type = r < .42 ? 'cushion' : (r < .72 ? 'grass' : (r < flowerCut ? 'lichen' : 'flower'));
      const base = TYPE_INFO[type].base;
      items.push({
        x, y,
        size: base*(.34 + depth*.9)*(.7+rnd()*.6),
        seed: (rnd()*2147483647)|0,
        type, alt,
        fog: .06 + (1-depth)*.26,
        detail: .48
      });
    }

    // understory herbs among the forest clumps
    for(let i=0;i<132;i++){
      const x = rnd()*W;
      const ry = ridgeY(x);
      const y = ry + 20 + rnd()*(meadowTopY(x) - ry - 30);
      const alt = altitudeAt(x, y);
      if(alt < 860 || alt > 3250) continue;
      if(inClearing(x, y, -4) && rnd() < .7) continue;
      const depth = clamp((y-ry)/(H-ry), 0, 1);
      const herbCut = SEASON === 0 ? .48 : (SEASON === 2 ? .78 : .62);
      const type = rnd() < .62 ? 'grass' : (rnd() < herbCut ? 'fern' : 'flower');
      const base = TYPE_INFO[type].base;
      items.push({
        x, y,
        size: base*(.28 + depth*.60)*(.7+rnd()*.5),
        seed: (rnd()*2147483647)|0,
        type, alt,
        fog: clamp(.04 + (1-depth)*.34, 0, .46),
        detail: .34
      });
    }

    // dark canopy masses and shadows under the clumps
    clumps.sort((a,b)=>a.y-b.y);
    for(const c of clumps){
      const seed = ((c.x*13 + c.y*7) | 0);
      const crnd = mulberry32(seed);
      const fogC = c.fog*.88;
      softEllipse(g, c.x, c.y + c.ch*.20, c.cw*.48, c.ch*.30, [33, 48, 39], .18);
      const conifer = c.dominant === 'pine' || c.dominant === 'fir';
      const shrub = c.dominant === 'rhodo' || c.dominant === 'willow' ||
                    c.dominant === 'twisted' || c.dominant === 'dwarfBamboo';

      if(conifer){
        // a continuous forest bank: dense serrated crown tops, no lone trunks
        g.save();
        const n2 = clamp(Math.round(c.cw / 11), 10, 26);
        for(let k=0;k<n2;k++){
          const t = (k + .5)/n2;
          const sx = c.x + (t - .5)*c.cw + (crnd()-.5)*c.cw*.05;
          const sy = c.y + (crnd()-.5)*c.ch*.30;
          const peak = c.ch*(.52 + crnd()*.78) * (1 - Math.abs(t-.5)*.34);
          const ww = c.cw*(.045 + crnd()*.035);
          g.beginPath();
          g.moveTo(sx - ww, sy);
          g.quadraticCurveTo(sx - ww*.30, sy - peak*.55, sx + (crnd()-.5)*ww*.4, sy - peak);
          g.quadraticCurveTo(sx + ww*.34, sy - peak*.52, sx + ww, sy);
          g.closePath();
          g.fillStyle = rgba(fogged(k%4 === 0 ? [45, 62, 48] : [31, 47, 39], fogC), .58 + crnd()*.24);
          g.fill();
          // a little lit edge on some crowns
          if(k%3 === 0){
            g.beginPath();
            g.moveTo(sx + ww*.10, sy - peak*.18);
            g.lineTo(sx + ww*.58, sy - peak*.46);
            g.strokeStyle = rgba(fogged([76, 94, 69], fogC), .17);
            g.lineWidth = 1;
            g.stroke();
          }
        }
        // the shaded foot of the bank
        softEllipse(g, c.x, c.y + c.ch*.12, c.cw*.46, c.ch*.30, [27, 42, 35], .20);
        g.restore();
      } else if(shrub){
        g.save();
        g.globalAlpha = .80;
        for(let k=0;k<3;k++){
          blobPath(g, c.x + (k-1)*c.cw*.22, c.y - c.ch*(.10 + k%2*.06),
            c.cw*.28, c.ch*.30, seed + 5 + k*7, 9);
          g.fillStyle = rgba(fogged(k%2 ? [58, 75, 52] : [47, 64, 47], fogC), .72);
          g.fill();
        }
        g.restore();
      } else {
        // overlapping leafy crowns, so the clump reads as one canopy
        g.save();
        g.globalAlpha = .90;
        const n2 = 4 + Math.floor(crnd()*3);
        for(let k=0;k<n2;k++){
          const t = (k + .5)/n2;
          const sx = c.x + (t - .5)*c.cw*.84 + (crnd()-.5)*c.cw*.08;
          const sy = c.y - c.ch*(.18 + crnd()*.26);
          blobPath(g, sx, sy, c.cw*(.13 + crnd()*.07), c.ch*(.34 + crnd()*.18),
            seed + 20 + k*9, 9);
          g.fillStyle = rgba(fogged(crnd() < .5 ? [43, 60, 43] : [50, 67, 46], fogC), .66);
          g.fill();
        }
        // shadow at the foot hides the trunks
        softEllipse(g, c.x, c.y + c.ch*.10, c.cw*.44, c.ch*.22, [30, 44, 36], .16);
        g.restore();
      }
    }

    // subalpine heath: a continuous mat of 高山杜鹃 / 高山柳 / 矮竹
    const srnd = mulberry32(0xa1b2c3);
    for(let i=0;i<1040;i++){
      const x = srnd()*W;
      const ry = ridgeY(x);
      const y = ry + 6 + Math.pow(srnd(), .92)*108;
      const alt = altitudeAt(x, y);
      if(alt < 2980 || alt > 3400) continue;
      if(noise2(x*.012, y*.05) < .36) continue;
      const s = 5 + Math.pow(srnd(), 1.6)*24;
      const fog = clamp(.03 + (y - ry)/190*.20, 0, .28);
      const t = srnd();
      const dark = t < .16 ? [86, 78, 52]
                 : t < .32 ? [102, 108, 70]
                 : t < .76 ? [52, 68, 49]
                 : [64, 79, 55];
      blobPath(g, x, y, s*.90, s*.30, (srnd()*1e9)|0, 8);
      g.fillStyle = rgba(fogged(dark, fog), .56);
      g.fill();
      for(let k=0;k<4;k++){
        leafShape(g,
          x + (srnd()-.5)*s*1.5, y + (srnd()-.4)*s*.5,
          s*(.20 + srnd()*.16), s*.07, (srnd()-.5)*1.2,
          fogged(srnd() < .5 ? [72, 88, 58] : [98, 108, 76], fog), .55, false);
      }
      if(srnd() < .10){
        g.beginPath();
        g.arc(x + s*.10, y - s*.16, 1.0 + srnd()*1.5, 0, TAU);
        g.fillStyle = rgba(fogged(srnd() < .7 ? [202, 186, 184] : [216, 200, 190], fog), .60);
        g.fill();
      }
    }

    // krummholz at the tree line: low twisted trees, never a closed canopy
    for(let i=0;i<30;i++){
      const x = 10 + srnd()*(W-20);
      const ry = ridgeY(x);
      const y = ry + 14 + srnd()*70;
      const alt = altitudeAt(x, y);
      if(alt < 3050 || alt > 3340) continue;
      const s = 16 + srnd()*22;
      const fog = clamp(.03 + srnd()*.06, 0, .12);
      drawWillow(g, x, y, s, (srnd()*1e9)|0, fog, .55, 1, true);
    }

    // draw far to near
    items.sort((a,b)=>a.y-b.y);
    for(const it of items){
      drawPlantByType(g, it.type, it.x, it.y, it.size, it.seed, it.fog, it.detail, 1, it.alt);
    }

    // scattered boulders in the alpine belt
    for(let i=0;i<42;i++){
      const x = rnd()*W;
      if(ridgeAlt(x) < 3340) continue;
      const y = ridgeY(x) + 12 + rnd()*66;
      rockPoly(g, x, y, 3 + rnd()*7, (rnd()*99999)|0, [132,134,120], .18);
    }
  }

  /* ------------------------------------------------------------
     Foreground meadow & framing groves
  ------------------------------------------------------------ */
  function meadowTopY(x){
    return 726 + 22*Math.sin(x*.0031 + 1.1) + 13*Math.sin(x*.0083 + .4) + 5*Math.sin(x*.019 + 2.0);
  }

  function drawMeadow(g){
    g.save();
    g.beginPath();
    g.moveTo(-20, H+20);
    g.lineTo(-20, meadowTopY(0));
    for(let x=0;x<=W;x+=4) g.lineTo(x, meadowTopY(x));
    g.lineTo(W+20, meadowTopY(W));
    g.lineTo(W+20, H+20);
    g.closePath();

    const MEADOW_GRADS = [
      ['#82a75a', '#789d4f', '#658746', '#54723e'],
      ['#7e9a52', '#749047', '#5f7d40', '#4f6d38'],
      ['#97894a', '#8c7d41', '#736536', '#5f5531'],
      ['#8e9894', '#828c88', '#717b78', '#636d6a']
    ];
    const mg = MEADOW_GRADS[SEASON];
    const grad = g.createLinearGradient(0, 690, 0, H);
    grad.addColorStop(0, mg[0]);
    grad.addColorStop(.34, mg[1]);
    grad.addColorStop(.72, mg[2]);
    grad.addColorStop(1, mg[3]);
    g.fillStyle = grad;
    g.fill();

    // clipped meadow texture
    g.save();
    g.clip();
    // soft undulating patches
    const rnd = mulberry32(77441);
    for(let i=0;i<130;i++){
      const x = rnd()*W;
      const y = meadowTopY(x) + rnd()*(H - meadowTopY(x));
      const rx = 40 + rnd()*150;
      const ry = 8 + rnd()*26;
      const cols = [[104,120,74],[132,144,88],[86,104,66],[150,152,96],[74,94,62]];
      softEllipse(g, x, y, rx, ry, cols[i%5], .10 + rnd()*.10);
    }
    // fine stipple, so the sward has grain instead of a flat wash
    for(let i=0;i<540;i++){
      const x = rnd()*W;
      const y = meadowTopY(x) + 4 + rnd()*(H - meadowTopY(x) - 6);
      const s = 2 + rnd()*5;
      g.fillStyle = rgba(i%2 ? [70,92,54] : [142,154,96], .09 + rnd()*.10);
      g.beginPath();
      g.ellipse(x, y, s, s*.34, 0, 0, TAU);
      g.fill();
    }
    // rolling ground contours
    softEllipse(g, 360, 792, 340, 26, [83, 99, 69], .16);
    softEllipse(g, 1080, 774, 400, 28, [123, 131, 87], .14);
    softEllipse(g, 740, 862, 520, 34, [72, 89, 65], .14);

    // morning light falling from the upper right
    const LIGHT_RGB = SEASON === 3 ? [226, 236, 243]
                    : SEASON === 2 ? [238, 214, 158]
                    : [232, 224, 174];
    const light = g.createLinearGradient(W, 716, 460, 900);
    light.addColorStop(0, rgba(LIGHT_RGB, .20));
    light.addColorStop(.52, rgba(LIGHT_RGB, .070));
    light.addColorStop(1, rgba(LIGHT_RGB, 0));
    g.fillStyle = light;
    g.fillRect(0, 700, W, 200);
    softEllipse(g, 1040, 792, 330, 64, SEASON === 3 ? [232, 240, 246] : LIGHT_RGB, .13);

    // low foreground shadow
    const fg = g.createLinearGradient(0, 790, 0, H);
    fg.addColorStop(0, 'rgba(36,50,40,0)');
    fg.addColorStop(1, 'rgba(36,50,40,.24)');
    g.fillStyle = fg;
    g.fillRect(0, 760, W, 140);
    g.restore();

    // crest light
    g.beginPath();
    g.moveTo(0, meadowTopY(0));
    for(let x=0;x<=W;x+=4) g.lineTo(x, meadowTopY(x));
    g.strokeStyle = 'rgba(199,198,151,.28)';
    g.lineWidth = 1.1;
    g.stroke();

    g.restore();
  }

  function drawMeadowDetail(g){
    const rnd = mulberry32(0x2f6e7a1);

    // moss and soil patches
    for(let i=0;i<58;i++){
      const x = rnd()*W;
      const y = meadowTopY(x) + 6 + rnd()*(H - meadowTopY(x) - 8);
      softEllipse(g, x, y, 24 + rnd()*90, 3 + rnd()*12,
        i%3 ? [106,118,78] : [82,95,66], .10 + rnd()*.10);
    }
    // a few real moss cushions, so the ground has softness underfoot
    for(let i=0;i<9;i++){
      const x = 40 + rnd()*(W-80);
      const y = meadowTopY(x) + 18 + rnd()*(H - meadowTopY(x) - 34);
      drawMossMat(g, x, y, 9 + rnd()*15, 3 + rnd()*5, (rnd()*1e9)|0, .02, .55);
    }

    // grass drifts, with open runs between them
    const drifts = [];
    for(let i=0;i<10;i++){
      drifts.push({
        x: -30 + (i + .5)/10*W + (rnd()-.5)*70,
        y: 746 + rnd()*(H - 760),
        rx: 58 + rnd()*118,
        ry: 14 + rnd()*32,
        n: 32 + Math.floor(rnd()*34),
        tone: rnd()
      });
    }
    for(const d of drifts){
      for(let k=0;k<d.n;k++){
        const a = rnd()*TAU, r = Math.sqrt(rnd());
        const x = d.x + Math.cos(a)*d.rx*r;
        const y = d.y + Math.sin(a)*d.ry*r;
        if(y < meadowTopY(x) + 3 || y > H - 2) continue;
        const s = (d.tone > .5 ? 8 : 10) + Math.pow(rnd(), 1.3)*22;
        drawGrass(g, x, y, s, (rnd()*2147483647)|0, .02 + rnd()*.07, .30 + d.tone*.06, 1);
      }
    }

    // scattered short grass
    for(let i=0;i<224;i++){
      const x = rnd()*W;
      const y = meadowTopY(x) + 3 + Math.pow(rnd(), .72)*(H - meadowTopY(x) - 4);
      const s = 7 + Math.pow(rnd(), 1.5)*18;
      drawGrass(g, x, y, s, (rnd()*2147483647)|0, .02 + rnd()*.06, .28, 1);
    }

    // taller fringe where the meadow meets the forest
    for(let i=0;i<96;i++){
      const x = rnd()*W;
      const y = meadowTopY(x) + 2 + rnd()*24;
      const s = 17 + rnd()*26;
      drawGrass(g, x, y, s, (rnd()*2147483647)|0, .05 + rnd()*.06, .36, 1);
    }

    // ferns and low herbs, mostly at the edges
    for(let i=0;i<42;i++){
      const x = rnd()*W;
      const y = meadowTopY(x) + 10 + rnd()*(H - meadowTopY(x) - 20);
      const s = 12 + rnd()*18;
      drawFern(g, x, y, s, (rnd()*2147483647)|0, .04, .40, 1);
    }

    // flower drifts: the meadow blooms hardest in spring, thins in autumn
    if(SEASON !== 3){
      const clusters = SEASON === 0 ? 13 : (SEASON === 2 ? 3 : 6);
      for(let c=0;c<clusters;c++){
        const cx = 120 + rnd()*(W - 240);
        const cy = meadowTopY(cx) + 26 + rnd()*(H - meadowTopY(cx) - 56);
        const n = (SEASON === 0 ? 7 : (SEASON === 2 ? 3 : 5)) + Math.floor(rnd()*(SEASON === 0 ? 8 : 5));
        const spread = 36 + rnd()*46;
        for(let k=0;k<n;k++){
          const x = cx + (rnd()-.5)*spread*2;
          const y = cy + (rnd()-.5)*spread*.7;
          if(y < meadowTopY(x) + 8) continue;
          const s = (SEASON === 0 ? 11 : 10) + rnd()*13;
          drawFlower(g, x, y, s, (rnd()*2147483647)|0, .03 + rnd()*.04, .46 + (SEASON===0?.08:0), 1, 950);
        }
      }
      if(SEASON === 0){
        // a fine scatter of early bloom across the spring sward
        for(let i=0;i<132;i++){
          const x = rnd()*W;
          const y = meadowTopY(x) + 8 + Math.pow(rnd(), .82)*(H - meadowTopY(x) - 14);
          const s = 6 + rnd()*9;
          drawFlower(g, x, y, s, (rnd()*2147483647)|0, .04 + rnd()*.05, .40 + rnd()*.12, 1, 950);
        }
      }
    }

    // stones
    for(let i=0;i<12;i++){
      const x = rnd()*W;
      const y = meadowTopY(x) + 18 + rnd()*(H - meadowTopY(x) - 30);
      rockPoly(g, x, y, 5 + rnd()*9, (rnd()*99999)|0, [122,126,108], .05);
    }
  }

  function drawForestEdge(g){
    const rnd = mulberry32(0x4d3c2b1);

    // an understory along the forest foot, so the edge is a thicket
    // rather than a row of bare trunks
    for(let i=0;i<78;i++){
      const x = rnd()*W;
      const edge = meadowTopY(x);
      const y = edge - 30 + rnd()*34;
      if(noise2(x*.009, .5) < .40 && rnd() < .55) continue;
      const s = 7 + Math.pow(rnd(), 1.35)*28;
      const tone = rnd();
      const dark = tone < .28 ? [56, 77, 49]
                 : tone < .58 ? [47, 68, 46]
                 : [64, 85, 53];
      softEllipse(g, x, y + s*.18, s*.80, s*.22, [26, 41, 34], .15);
      blobPath(g, x, y, s*.78, s*.60, (rnd()*1e9)|0, 9);
      g.fillStyle = rgba(seasonColor(dark), .84);
      g.fill();
      // a higher lobe breaks the pancake silhouette
      blobPath(g, x + s*.20, y - s*.36, s*.52, s*.40, (rnd()*1e9)|0, 8);
      g.fillStyle = rgba(seasonColor(tone < .4 ? [68, 88, 55] : [54, 75, 49]), .78);
      g.fill();
      // lit crown, so the thicket has a top and a shaded belly
      blobPath(g, x + s*.30, y - s*.48, s*.34, s*.26, (rnd()*1e9)|0, 7);
      g.fillStyle = rgba(seasonColor([98, 120, 70]), .34);
      g.fill();
      for(let k=0;k<7;k++){
        const a = -Math.PI + rnd()*Math.PI;
        leafShape(g,
          x + Math.cos(a)*s*.62, y - s*.18 + Math.sin(a)*s*.42,
          s*(.18 + rnd()*.16), s*.065, a + (rnd()-.5)*.8,
          seasonColor(rnd() < .46 ? [92, 112, 70] : [62, 82, 56]), .54, false);
      }
      // upright shoots keep the thicket from reading as a row of stones
      const shoots = 3 + Math.floor(rnd()*3);
      for(let k=0;k<shoots;k++){
        const sx = x + (rnd()-.5)*s*1.05;
        const sh = s*(.34 + rnd()*.52);
        g.strokeStyle = rgba(seasonColor([64, 80, 52]), .52);
        g.lineWidth = Math.max(.45, s*.022);
        g.beginPath();
        g.moveTo(sx, y - s*.18);
        g.quadraticCurveTo(sx + (rnd()-.5)*s*.18, y - s*.18 - sh*.6,
          sx + (rnd()-.5)*s*.28, y - s*.18 - sh);
        g.stroke();
        leafShape(g, sx, y - s*.18 - sh, s*.15, s*.048,
          -1.2 + rnd()*.7, seasonColor([85, 100, 63]), .52, false);
        leafShape(g, sx, y - s*.18 - sh*.78, s*.13, s*.042,
          -2.1 + rnd()*.6, seasonColor([71, 88, 57]), .52, false);
      }
    }

    // young trees and fern rosettes stepping out of the shade
    for(let i=0;i<8;i++){
      const edgeSide = rnd() < .62;
      const x = edgeSide
        ? (rnd() < .5 ? 34 + rnd()*430 : W - 34 - rnd()*430)
        : 34 + rnd()*(W-68);
      const y = meadowTopY(x) + 3 + rnd()*7;
      const s = 40 + rnd()*44;
      if(rnd() < .55){
        drawBroadleaf(g, x, y, s, (rnd()*1e9)|0, .04, .62, 1, rnd() < .28 ? 1 : 0);
      } else {
        drawFern(g, x, y, s*.62, (rnd()*1e9)|0, .04, .66, 1);
      }
    }

    // dappled shade spilling from the canopy onto the first metres of grass
    for(let i=0;i<22;i++){
      const x = rnd()*W;
      const edge = meadowTopY(x);
      softEllipse(g, x, edge + 4 + rnd()*22, 30 + rnd()*70, 4 + rnd()*9,
        [55, 72, 52], .05 + rnd()*.05);
    }
  }

  function drawClearingLife(g){
    // the glades need a floor: grass, herbs and stones drawn after the wood,
    // so the opening reads as a montane meadow instead of a bald patch
    const rnd = mulberry32(0x7be31c);
    CLEARINGS.forEach((c) => {
      const alt = altitudeAt(c.x, c.y);
      for(let i=0;i<84;i++){
        const a = rnd()*TAU, d = Math.sqrt(rnd())*.94;
        const x = c.x + Math.cos(a)*c.rx*d;
        const y = c.y + Math.sin(a)*c.ry*d + c.ry*.20;
        const type = rnd() < .72 ? 'grass' : (rnd() < .6 ? 'fern' : 'flower');
        const s = 7 + rnd()*11;
        drawPlantByType(g, type, x, y, s, (rnd()*1e9)|0, .06, .55, 1, alt);
      }
      for(let k=0;k<3;k++){
        const a = rnd()*TAU;
        const x = c.x + Math.cos(a)*c.rx*.86;
        const y = c.y + Math.sin(a)*c.ry*.86 + c.ry*.18;
        drawPlantByType(g, alt > 2300 ? 'dwarfBamboo' : 'bamboo',
          x, y, 15 + rnd()*12, (rnd()*1e9)|0, .06, .5, 1, alt);
      }
      for(let k=0;k<3;k++){
        rockPoly(g, c.x+(rnd()-.5)*c.rx*1.3, c.y+(rnd()-.4)*c.ry*1.1,
          2.5+rnd()*4, (rnd()*1e9)|0, [120,124,106], .12);
      }
    });
  }

  function drawMassifHaze(g){
    // thin veils between forested spurs, to separate the near and far slopes
    const bands = [
      [ 220, 348, 330, 22, .055],
      [ 690, 368, 380, 24, .050],
      [1190, 342, 320, 20, .048],
      [ 950, 418, 380, 24, .048],
      [ 100, 448, 300, 18, .080],
      [ 380, 502, 340, 22, .075],
      [ 690, 548, 360, 24, .080],
      [1020, 486, 320, 20, .070],
      [1330, 540, 340, 22, .080],
      [ 250, 620, 320, 24, .060],
      [ 860, 640, 380, 28, .070],
      [1210, 650, 300, 22, .060]
    ];
    for(const [x, y, rx, ry, a] of bands){
      softEllipse(g, x, y, rx, ry, [211, 220, 208], a);
      softEllipse(g, x + rx*.30, y - ry*.25, rx*.55, ry*.55, [232, 236, 224], a*.5);
    }
  }

  function drawValleyMist(g){
    // low cloud caught between the forest foot and the open meadow
    const bands = [
      [-60, 672, 380, 40, .11],
      [ 150, 706, 440, 48, .12],
      [ 430, 664, 360, 36, .09],
      [ 700, 714, 480, 52, .13],
      [ 980, 680, 400, 40, .10],
      [1250, 710, 460, 50, .12],
      [1500, 676, 340, 38, .10]
    ];
    for(const [x, y, rx, ry, a] of bands){
      softEllipse(g, x, y, rx, ry, [223, 229, 215], a);
      softEllipse(g, x + rx*.28, y - ry*.30, rx*.62, ry*.60, [238, 240, 228], a*.45);
    }
    const gr = g.createLinearGradient(0, 690, 0, 770);
    gr.addColorStop(0, 'rgba(226,231,217,.07)');
    gr.addColorStop(.55, 'rgba(226,231,217,.035)');
    gr.addColorStop(1, 'rgba(226,231,217,0)');
    g.fillStyle = gr;
    g.fillRect(0, 690, W, 80);
  }

  const FG_TREES = [
    { x: 300, y: 815, type: 'oak', size: 132, seed: 19127, detail: 1.2 },
    { x: 400, y: 842, type: 'maple', size: 106, seed: 28191, detail: 1.05 },
    { x: 244, y: 864, type: 'fern', size: 54, seed: 9921, detail: 1.0 },
    { x: 1272, y: 810, type: 'pine', size: 146, seed: 73121, detail: 1.25 },
    { x: 1372, y: 852, type: 'oak', size: 116, seed: 81823, detail: 1.1 },
    { x: 1198, y: 872, type: 'bamboo', size: 58, seed: 5521, detail: 1.0 }
  ];

  function drawForegroundTrees(g){
    FG_TREES.forEach(t => {
      drawPlantByType(g, t.type, t.x, t.y, t.size, t.seed, .0, t.detail, 1, 1000);
      // moss and the odd mushroom at the foot of the nearer trunks
      if(t.type === 'oak' || t.type === 'maple' || t.type === 'pine'){
        mossTuft(g, t.x - t.size*.14, t.y - 1, t.size*.105, (t.seed + 5)|0, 0);
        mossTuft(g, t.x + t.size*.11, t.y, t.size*.075, (t.seed + 9)|0, 0);
        if(t.detail > 1.05){
          drawShroom(g, t.x + t.size*.19, t.y + 1, t.size*.045, (t.seed + 11)|0, 0);
        }
      }
    });
  }

  /* ------------------------------------------------------------
     Build background
  ------------------------------------------------------------ */
  function meadowClipPath(g){
    g.beginPath();
    g.moveTo(-20, H+20);
    g.lineTo(-20, meadowTopY(0));
    for(let x=0;x<=W;x+=4) g.lineTo(x, meadowTopY(x));
    g.lineTo(W+20, meadowTopY(W));
    g.lineTo(W+20, H+20);
    g.closePath();
  }

  function drawSummerSun(g){
    const rnd = mulberry32(0x2c8d51);

    // long shafts of light spilling from the sun across the valley
    g.save();
    g.globalCompositeOperation = 'lighter';
    const shafts = [
      { cx: 1090, cy: 330, rx: 420, ry: 60, rot: -.98, a: .044 },
      { cx: 1010, cy: 500, rx: 520, ry: 80, rot: -1.02, a: .048 },
      { cx: 930,  cy: 675, rx: 540, ry: 100, rot: -1.05, a: .046 },
      { cx: 1200, cy: 480, rx: 360, ry: 42, rot: -.86, a: .032 },
      { cx: 820,  cy: 390, rx: 380, ry: 48, rot: -1.10, a: .028 }
    ];
    for(const s of shafts){
      g.save();
      g.translate(s.cx, s.cy);
      g.rotate(s.rot);
      softEllipse(g, 0, 0, s.rx, s.ry, [255, 238, 196], s.a);
      g.restore();
    }
    g.restore();

    // sunlit pools drifting over the sward
    g.save();
    meadowClipPath(g);
    g.clip();
    g.globalCompositeOperation = 'lighter';
    for(let i=0;i<26;i++){
      const x = rnd()*W;
      const top = meadowTopY(x);
      const y = top + 14 + rnd()*Math.max(40, H - top - 20);
      softEllipse(g, x, y, 50 + rnd()*130, 9 + rnd()*20, [255, 236, 182], .045 + rnd()*.045);
    }
    g.restore();

    // a breath of warm haze over the lower valley
    g.save();
    g.globalCompositeOperation = 'lighter';
    const breath = g.createLinearGradient(W, 620, 380, H);
    breath.addColorStop(0, 'rgba(255,233,178,.06)');
    breath.addColorStop(.55, 'rgba(255,236,186,.035)');
    breath.addColorStop(1, 'rgba(255,240,200,0)');
    g.fillStyle = breath;
    g.fillRect(0, 560, W, H - 560);
    g.restore();
  }

  function drawSeasonOverlay(g){
    if(SEASON === 1){
      drawSummerSun(g);
      return;
    }
    if(SEASON === 2){
      // fallen leaves lying in the sward
      const rnd = mulberry32(0x51eaf2);
      g.save();
      meadowClipPath(g);
      g.clip();
      for(let i=0;i<240;i++){
        const x = rnd()*W;
        const y = meadowTopY(x) + 6 + rnd()*(H - meadowTopY(x));
        const s = 1.2 + rnd()*3.4;
        g.fillStyle = rgba(rnd() < .5 ? [158, 92, 41] : [190, 131, 53], .28 + rnd()*.32);
        g.beginPath();
        g.ellipse(x, y, s, s*.46, rnd()*TAU, 0, TAU);
        g.fill();
      }
      g.restore();
      return;
    }
    if(SEASON !== 3) return;

    const rnd = mulberry32(0x77b2c1);

    /* --- thick snow on the massif crest --- */
    g.save();
    clipMassif(g);

    // a crisp, lobed cap that follows the skyline
    g.beginPath();
    g.moveTo(0, ridgeY(0));
    for(let x=0;x<=W;x+=3) g.lineTo(x, ridgeY(x));
    for(let x=W;x>=0;x-=3){
      const t = 7 + 22*noise2(x*.0075, 3.7) + 9*Math.abs(Math.sin(x*.023 + 1.1));
      g.lineTo(x, ridgeY(x) + t);
    }
    g.closePath();
    g.fillStyle = 'rgba(247,251,255,.88)';
    g.fill();

    // soften its lower fringe into drifting lobes
    for(let x=0;x<=W;x+=9){
      const t = 10 + 24*noise2(x*.0075, 3.7) + 9*Math.abs(Math.sin(x*.023 + 1.1));
      softEllipse(g, x, ridgeY(x) + t*.9, 9 + rnd()*10, t*.45,
        [244,249,254], .22 + rnd()*.16);
    }

    // rock breaking through the snow, so the cap is not icing
    for(let i=0;i<54;i++){
      const x = rnd()*W;
      const t = 7 + 22*noise2(x*.0075, 3.7) + 9*Math.abs(Math.sin(x*.023 + 1.1));
      if(t < 15) continue;
      const y = ridgeY(x) + 3 + rnd()*(t - 8);
      softEllipse(g, x, y, 4 + rnd()*12, 2 + rnd()*5,
        [142,156,166], .05 + rnd()*.07);
    }
    for(let i=0;i<26;i++){
      const x = rnd()*W;
      const t = 7 + 22*noise2(x*.0075, 3.7) + 9*Math.abs(Math.sin(x*.023 + 1.1));
      softEllipse(g, x, ridgeY(x) + t*.56, 10 + rnd()*22, t*.16,
        [212,228,241], .10 + rnd()*.10);
    }

    // blue shadow under the cap gives the snow depth
    for(let i=0;i<30;i++){
      const x = rnd()*W;
      softEllipse(g, x, ridgeY(x) + 30 + rnd()*34, 4 + rnd()*9, 16 + rnd()*34,
        [148,172,196], .05 + rnd()*.07);
    }

    // snow fingers running down the gullies
    for(let i=0;i<24;i++){
      const x = rnd()*W;
      const y = ridgeY(x) + 20 + rnd()*36;
      softEllipse(g, x, y, 3 + rnd()*6, 16 + rnd()*38, [242,248,253], .08 + rnd()*.09);
    }

    // bright wind lip on the ridge itself
    g.beginPath();
    g.moveTo(0, ridgeY(0));
    for(let x=0;x<=W;x+=3) g.lineTo(x, ridgeY(x));
    g.strokeStyle = 'rgba(252,254,255,.72)';
    g.lineWidth = 2.2;
    g.stroke();
    g.restore();

    /* --- frost held on the forest canopy --- */
    for(let i=0;i<250;i++){
      const x = rnd()*W;
      const y0 = ridgeY(x) + 18;
      const limit = Math.max(y0 + 20, meadowTopY(x) - 6);
      const y = y0 + Math.pow(rnd(), .88)*(limit - y0);
      if(noise2(x*.013, y*.015) < .36 && rnd() < .55) continue;
      const s = 1.5 + Math.pow(rnd(), 1.5)*4.4;
      softEllipse(g, x + s*.25, y + s*.6, s*1.7, s*.75, [168,190,212], .07 + rnd()*.08);
      softEllipse(g, x, y, s*1.35, s*.60, [246,250,254], .22 + rnd()*.24);
      if(rnd() < .32){
        softEllipse(g, x - s*.25, y - s*.22, s*.8, s*.32, [255,255,255], .18 + rnd()*.18);
      }
    }
  }

  function drawSnowGround(g){
    const rnd = mulberry32(0x5b1d93);
    g.save();
    meadowClipPath(g);
    g.clip();

    // the cover itself, deepest toward the front
    const snow = g.createLinearGradient(0, 620, 0, H);
    snow.addColorStop(0, 'rgba(228,237,245,.58)');
    snow.addColorStop(.28, 'rgba(234,243,250,.76)');
    snow.addColorStop(.62, 'rgba(240,247,252,.86)');
    snow.addColorStop(1, 'rgba(236,244,250,.92)');
    g.fillStyle = snow;
    g.fillRect(0, 600, W, H - 600);

    // soft shade where the snowline meets the forest
    for(let x=0;x<=W;x+=40){
      softEllipse(g, x, meadowTopY(x) + 7, 48, 11, [146,172,198], .10);
    }

    // cool hollows so the cover reads as volume, not paint
    for(let i=0;i<48;i++){
      const x = rnd()*W;
      const top = meadowTopY(x);
      const y = top + 24 + rnd()*Math.max(30, H - top - 30);
      softEllipse(g, x, y, 46 + rnd()*150, 12 + rnd()*28, [142,168,196], .10 + rnd()*.08);
    }
    for(let i=0;i<16;i++){
      const x = rnd()*W;
      const y = 700 + rnd()*190;
      softEllipse(g, x, y, 120 + rnd()*220, 8 + rnd()*18, [150,174,200], .05 + rnd()*.05);
    }

    // wind drifts: shadow underside, bright crest
    for(let i=0;i<120;i++){
      const x = rnd()*W;
      const top = meadowTopY(x);
      const y = top + 18 + rnd()*Math.max(30, H - top - 12);
      const rx = 22 + rnd()*90;
      const ry = 4 + rnd()*14;
      softEllipse(g, x, y + ry*1.05, rx, ry*.9, [138,164,194], .12 + rnd()*.10);
      softEllipse(g, x, y, rx, ry, [247,251,255], .26 + rnd()*.30);
      softEllipse(g, x - rx*.16, y - ry*.34, rx*.62, ry*.38, [255,255,255], .24 + rnd()*.26);
    }

    // dry grass and stems breaking the surface
    for(let i=0;i<260;i++){
      const x = rnd()*W;
      const top = meadowTopY(x);
      const y = top + 12 + rnd()*Math.max(20, H - top - 14);
      const h = 3 + rnd()*12;
      g.strokeStyle = rgba([92,105,92], .18 + rnd()*.22);
      g.lineWidth = .7 + rnd()*.5;
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + (rnd()-.5)*3, y - h*.55, x + (rnd()-.5)*8, y - h);
      g.stroke();
    }

    // a few stones still poking out
    for(let i=0;i<16;i++){
      softEllipse(g, rnd()*W, 700 + rnd()*180, 14 + rnd()*34, 4 + rnd()*10,
        [104,114,104], .07 + rnd()*.06);
    }

    // a cool edge at the very front keeps the drift from floating
    const edge = g.createLinearGradient(0, H - 100, 0, H);
    edge.addColorStop(0, 'rgba(144,170,196,0)');
    edge.addColorStop(1, 'rgba(140,166,194,.22)');
    g.fillStyle = edge;
    g.fillRect(0, H - 100, W, 100);
    g.restore();
  }

  function renderSceneHalf(pane, originX){
    const cv = makePlateCanvas();

    g.setTransform(1,0,0,1,0,0);
    g.fillStyle = '#e9ece3';
    g.fillRect(0,0,cv.width,cv.height);
    const keepX0 = worldX0, keepBias = seedBias;
    worldX0 = Math.round(originX || 0);
    seedBias = ((pane|0) * 0x1f3d5b7) | 0;
    plateTransform(g);

    drawSky(g);
    drawFarRidges(g);
    drawMainMassif(g);
    drawMassifForm(g);
    drawSlopeTexture(g);
    drawClearings(g);
    drawRockOutcrops(g);
    drawRidgeLight(g);

    seedBias = keepBias;
    return cv;
