  function drawFocusLens(g, now){
    if(lensT <= .004 || lensIdx < 0) return;
    const p = shimmerAt(lensIdx);
    const R = lensRadius();
    const k = 1 + .30 * lensT;
    const dw = R * 2 * k;
    const size = Math.max(8, Math.round(dw * dpr));
    if(lensCanvas.width !== size || lensCanvas.height !== size){
      lensCanvas.width = size;
      lensCanvas.height = size;
    }
    const sx = (p.x - R) * dpr, sy = (p.y - R) * dpr;
    const sw = 2 * R * dpr;
    lensctx.setTransform(1, 0, 0, 1, 0, 0);
    lensctx.clearRect(0, 0, size, size);
    lensctx.drawImage(canvas, sx, sy, sw, sw, 0, 0, size, size);
    const plate = detailPlates[lensIdx];
    if(plate){
      const pa = clamp((lensT - .10) / .55, 0, 1);
      if(pa > .002){
        const pk = 1 + .035 * Math.sin(now * .00021 + lensIdx);
        const pw = size * pk;
        lensctx.globalAlpha = pa;
        lensctx.drawImage(plate, (size - pw) / 2, (size - pw) / 2, pw, pw);
        lensctx.globalAlpha = 1;
      }
    }
    lensctx.globalCompositeOperation = 'destination-in';
    const gr = lensctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    gr.addColorStop(0, 'rgba(0,0,0,1)');
    gr.addColorStop(.60, 'rgba(0,0,0,1)');
    gr.addColorStop(.76, 'rgba(0,0,0,.80)');
    gr.addColorStop(.88, 'rgba(0,0,0,.30)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    lensctx.fillStyle = gr;
    lensctx.fillRect(0, 0, size, size);
    lensctx.globalCompositeOperation = 'source-over';
    g.drawImage(lensCanvas, p.x - dw/2, p.y - dw/2, dw, dw);
  }

  function drawShimmers(g, now){
    for(let i = 0; i < STORY.length; i++){
      const vis = shimmerVis(i);
      if(vis <= .015) continue;
      const p = shimmerAt(i);
      const breath = .5 + .5 * Math.sin(now * TAU / GLOW_PERIOD[i] + i * 1.7);
      const hot = shimHot === i, open = noteOpen === i;
      let a = (.34 + .14 * breath) * vis;
      if(hot) a = .74 * vis;
      if(open) a = .66 * vis;
      const R = 32 + 10 * breath + (hot || open ? 16 : 0);
      /* a soft warm halo, plus a slightly darker rim so it still reads
         on the pale grey of the uncoloured plate */
      const halo = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, R * 1.12);
      halo.addColorStop(0, 'rgba(120,96,44,0)');
      halo.addColorStop(.78, 'rgba(120,96,44,' + (a * .10).toFixed(3) + ')');
      halo.addColorStop(1, 'rgba(120,96,44,0)');
      g.fillStyle = halo;
      g.beginPath(); g.arc(p.x, p.y, R * 1.12, 0, TAU); g.fill();
      const gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
      gr.addColorStop(0, 'rgba(255,247,208,' + a.toFixed(3) + ')');
      gr.addColorStop(.28, 'rgba(255,239,190,' + (a * .70).toFixed(3) + ')');
      gr.addColorStop(.62, 'rgba(255,231,170,' + (a * .30).toFixed(3) + ')');
      gr.addColorStop(1, 'rgba(255,226,160,0)');
      g.fillStyle = gr;
      g.beginPath(); g.arc(p.x, p.y, R, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,253,236,' + Math.min(.96, a * 1.8).toFixed(3) + ')';
      g.beginPath(); g.arc(p.x, p.y, 2.5, 0, TAU); g.fill();
      if(hot || open){
        g.strokeStyle = 'rgba(255,241,193,' + (hot ? .38 : .28).toFixed(3) + ')';
        g.lineWidth = .9;
        g.beginPath(); g.arc(p.x, p.y, R * .52, 0, TAU); g.stroke();
      }
    }
  }

  /* ------------------------------------------------------------
     Main render loop
  ------------------------------------------------------------ */
  function updateReadoutSmoothing(now){
    if(displayAlt !== null && targetAlt !== null){
      const d = targetAlt - displayAlt;
      if(Math.abs(d) > .35){
        displayAlt += d * .07;
        updateAltText();
      }
    }
    const targetCursor = (hoverValid && shimHot < 0) ? 1 : 0;
    cursorAlpha += (targetCursor - cursorAlpha) * .06;
  }

  function updateCamera(dt){
    const hold = shimHot >= 0 || noteOpen >= 0;
    if(scrollFreeze && (Math.abs(pointer.x - scrollFreeze.x) > 26 ||
                        Math.abs(pointer.y - scrollFreeze.y) > 26)){
      scrollFreeze = null;
    }
    if(!hold && pointer.inCanvas && !scrollFreeze){
      lastProgress = clamp(pointer.x / cssW, 0, 1);
    }
    const maxCam = camMax();
    const targetCam = lastProgress * maxCam;
    if(!pointer.down){
      const diff = targetCam - camX;
      const stopAt = Math.max(1.2, cssW * .0022);
      if(Math.abs(diff) <= stopAt){
        camX = targetCam;
        camVel = 0;
      } else {
        /* one even walk: a steady pace wherever the hand is, and the only
           change of speed is the gentle ramp in and out at either end */
        const want = Math.sign(diff) * Math.min(CAM_SLOW * cssW, Math.abs(diff) * 2.2);
        const step = CAM_ACCEL * cssW * dt;
        if(camVel < want) camVel = Math.min(want, camVel + step);
        else if(camVel > want) camVel = Math.max(want, camVel - step);
        camX += camVel * dt;
        if((targetCam - camX) * diff <= 0){ camX = targetCam; camVel = 0; }
      }
    } else {
      camVel = 0;
    }
    camX = clamp(camX, 0, maxCam);
    scrollProgress = maxCam > 0 ? camX / maxCam : 0;
    seasonFloat = clamp(camX / tileStep(), 0, SCROLL_TILES - 1);

    const dom = Math.round(seasonFloat);
    if(dom !== SEASON) applyDominantSeason(dom);
    if(seasonDotEl) seasonDotEl.style.left = (scrollProgress * 100).toFixed(2) + '%';
  }

  function render(now){
    const dt = Math.min(.05, Math.max(.001, (now - fxLast)/1000));
    fxLast = now;
    ambientMs += dt * 1000 * PACE;

    updateGesturePointer(now, dt);
    updateStoryHover(now);
    updateGestureAim(now);
    updateLens(dt);
    updateCamera(dt);
    if(pointer.inCanvas){
      const w = screenToWorld(pointer.x, pointer.y);
      pointer.wx = w.x;
      pointer.wy = w.y;
      hoverValid = isValidGround(w.x, w.y) || shimHot >= 0;
    }

    updatePlants(now);
    updateReadoutSmoothing(now);
    updateBlooms(now);
    hoverReveal(now);
    updateColony(now, dt);
    updateSeasonFX(now, dt);
    updatePointerBees(now, dt);

    const camMoved = Math.abs(camX - prevCamX) > .05;
    prevCamX = camX;

    if(plantLayerDirty || camMoved) redrawPlantLayer(now);
    if(maskDirty || revealDirty || camMoved) rebuildReveal();

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#e9ece3';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    /* the grey stone of every stretch that touches the frame; drawn from
       the east back, so each western stretch thins over its neighbour */
    for(let t=SCROLL_TILES-1;t>=0;t--){
      const dx = t*tileStep() - camX;
      if(dx >= cssW || dx + cssW <= 0) continue;
      const tile = scrollTiles[t];
      if(!tile) continue;
      ctx.globalAlpha = t < SCROLL_TILES - 1 ? endK() : 1;
      ctx.drawImage(tile.grey, 0, 0, plateW, plateH, dx, 0, cssW, cssH);
      ctx.globalAlpha = 1;
    }
    /* colour, only where the pointer has been */
    if(revealCanvas.width > 1){
      ctx.drawImage(revealCanvas, 0, 0, plateW, plateH, 0, 0, cssW, cssH);
    }

    presentTransform(ctx);
    drawAnimatedMist(ctx, now);
    drawSeasonFX(ctx, now);
    drawRipples(ctx, now);
    drawSwarms(ctx, now);
    drawColony(ctx, now);
    drawCursor(ctx);
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawFocusLens(ctx, now);
    drawShimmers(ctx, now);
    drawPointerBees(ctx, now);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  let rafId = 0;
  function loop(now){
    nowMs = now;
    render(now);
    rafId = requestAnimationFrame(loop);
  }

  /* ------------------------------------------------------------
     Resize & boot
  ------------------------------------------------------------ */
  function layout(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cssW = Math.max(1, window.innerWidth);
    cssH = Math.max(1, window.innerHeight);
    scale = Math.max(cssW / W, cssH / H);
    ox = (cssW - W * scale) / 2;
    oy = (cssH - H * scale) / 2;
    /* keep the cached plates inside a sane memory budget */
    plateScale = Math.max(.55, Math.min(dpr, 1.5, 2400 / Math.max(1, cssW)));
    plateW = Math.max(1, Math.round(cssW * plateScale));
    plateH = Math.max(1, Math.round(cssH * plateScale));
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    camX = clamp(lastProgress * camMax(), 0, camMax());
    camVel = 0;
    camY = 0;
  }

  function buildScroll(){
    buildScrollTiles();
    SEASON = Math.round(clamp(seasonFloat, 0, 3));
    FOG = SEASON_FOG[SEASON].slice();
    plantLayerDirty = true;
    redrawPlantLayer(performance.now());
    maskDirty = true;
    revealDirty = true;
    rebuildReveal();
    updateSeasonUI();
  }

  function bootScroll(){
    layout();
    camX = lastProgress * camMax();
    scrollProgress = camMax() > 0 ? camX / camMax() : 0;
    seasonFloat = clamp(camX / tileStep(), 0, SCROLL_TILES - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      buildScroll();
      if(veilEl) veilEl.classList.add('hide');
      canvas.classList.add('in');
      fxLast = performance.now();
      requestAnimationFrame(loop);
    }));
  }

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const oldW = cssW;
      layout();
      if(cssW !== oldW){
        camX = clamp(lastProgress * camMax(), 0, camMax());
        seasonFloat = clamp(camX / tileStep(), 0, SCROLL_TILES - 1);
      }
      if(veilEl) veilEl.classList.remove('hide');
      setTimeout(() => {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          buildScroll();
          if(noteOpen >= 0) closeNote();
          if(veilEl) veilEl.classList.add('hide');
        }));
      }, 40);
    }, 180);
  }, { passive: true });

  // first paint
  setCounts();
  seedColony();
  reseedSeasonFX();
  fxLast = performance.now();
  bootScroll();

  /* ------------------------------------------------------------
     Optional demo state (append ?demo to the URL)
  ------------------------------------------------------------ */
  function bootDemo(){
    const now = performance.now();
    const demo = [
      [700, 872, 'oak', 118, 101, true],
      [790, 892, 'flower', 34, 102, true],
      [860, 864, 'grass', 44, 103, true],
      [975, 884, 'fern', 44, 104, true],
      [1030, 852, 'flower', 32, 105, true],
      [570, 862, 'bamboo', 58, 106, true],
      [470, 880, 'grass', 40, 107, true],
      [655, 690, 'oak', 78, 108, true],
      [900, 622, 'fir', 62, 109, true],
      [1240, 560, 'pine', 56, 110, true],
      [1400, 336, 'rhodo', 26, 111, true],
      [1040, 248, 'cushion', 14, 112, true],
      [965, 316, 'flower', 17, 113, true]
    ];
    demo.forEach(d => {
      spawnPlant(d[0], d[1], {
        type: d[2], size: d[3], seed: d[4],
        start: now - 9000, duration: 2000, silent: true, fog: 0.03
      });
    });
    // a few in-progress shoots
    spawnPlant(830, 876, { type:'flower', size:30, seed:201, start: now-800, duration:2200, silent:true });
    spawnPlant(1080, 866, { type:'grass', size:36, seed:202, start: now-500, duration:1500, silent:true });
    spawnPlant(1240, 872, { type:'flower', size:28, seed:203, start: now-1100, duration:2300, silent:true });

    // explicit low swarm for the screenshot
    const cx = 895, cy = 835;
    const bees = [];
    for(let i=0;i<6;i++){
      bees.push({
        phase: Math.random()*TAU,
        rx: 16 + Math.random()*38,
        ry: 7 + Math.random()*14,
        speed: .34 + Math.random()*.30,
        wob: 1.4 + Math.random()*2.4,
        size: 3.4 + Math.random()*1.5,
        wing: Math.random()*10
      });
    }
    swarms.push({ cx, cy, start: now - 1200, dur: 6000, bees });

    // pre-revealed patches, so the demo shows both the grey plate and
    // the living colour at the same time
    [[300,800,180],[700,790,200],[1050,780,180],[1330,800,160],
     [900,650,130],[655,690,100],[900,622,100],[1240,560,90],
     [1400,336,72],[1040,248,72],[965,316,72]].forEach(([x,y,r]) => {
      stampMask(x, y, r, .58);
      stampMask(x + r*.28, y - r*.12, r*.55, .45);
    });

    plantLayerDirty = true;
    hintEl.classList.add('hide');
  }

  const demoOn = /(?:\?|&)demo(?:=|\b)/.test(location.search) || location.hash.indexOf('demo') >= 0;
  if(demoOn) setTimeout(bootDemo, 320);

  // expose a tiny hook for manual exploration
  /* a small window onto the scroll, for checking it from outside */
  window.__qinling = {
    state: () => ({
      season: SEASON,
      seasonFloat: +seasonFloat.toFixed(3),
      progress: +scrollProgress.toFixed(3),
      camX: Math.round(camX),
      camVel: Math.round(camVel),
      ptr: [Math.round(ptrBee.x), Math.round(ptrBee.y)],
      speed: Math.round(Math.sqrt(ptrBee.vx * ptrBee.vx + ptrBee.vy * ptrBee.vy)),
      bees: colony.slice(0, BEE_COUNT[SEASON]).map(b => [Math.round(b.x), Math.round(b.y)]),
      fx: seasonFX.length,
      counts: {...counts}
    }),
    story: (i) => { if(i === undefined) return noteOpen; if(noteOpen === i) closeNote(); else openNote(i); },
    shimmer: (i) => { const p = shimmerAt(i); return [Math.round(p.x), Math.round(p.y)]; },
    lens: () => ({ t:+lensT.toFixed(3), i:lensIdx, want:lensWant, r:Math.round(lensRadius()) }),
    vis: (i) => +shimmerVis(i).toFixed(3),
    guide: (k) => setGuide(k),
    sound: () => {
      let peak = 0;
      if(sound.analyser){
        const a = new Float32Array(sound.analyser.fftSize);
        sound.analyser.getFloatTimeDomainData(a);
        for(let i = 0; i < a.length; i++) peak = Math.max(peak, Math.abs(a[i]));
      }
      return { state: sound.ctx ? sound.ctx.state : 'none', off: sound.off,
               gain: sound.master ? +sound.master.gain.value.toFixed(3) : 0,
               peak: +peak.toFixed(3) };
    },
    copy: (i) => STORY[i]
  };
})();
</script>
